const ex={mul:(a,b,r)=>!Number.isInteger(a)||!Number.isInteger(b)?`🛒 ${fmt(b)} kg godteri til ${fmt(a)} kr per kg koster ${fmt(r)} kr.`:pick([`🟩 Minecraft: ${fmt(a)} kister med ${fmt(b)} diamanter i hver = ${fmt(r)} diamanter.`,`🍕 ${fmt(a)} pizzaer med ${fmt(b)} biter hver = ${fmt(r)} biter.`,`🤸 ${fmt(a)} runder med ${fmt(b)} hopp hver = ${fmt(r)} hopp.`]),

function places(n){const s=String(n),out=[];for(let i=0;i<s.length;i++){const v=+s[i]*10**(s.length-1-i);if(v)out.push(v)}return out}
function explainMul(a,b){const r=+(a*b).toFixed(10);let s=`<b>${fmt(a)} · ${fmt(b)} = ${fmt(r)}</b><br>`;
  if(Number.isInteger(a)&&Number.isInteger(b)){
    if(a>=1&&b>=1&&a<=10&&b<=10)return s+whyMult(a,b)+'<br>'+ex.mul(a,b,r)+(a*b<=100?V.grid(Math.min(a,b),Math.max(a,b)):'');

/* ---- foto av regnestykker: lokal tekstgjenkjenning (Tesseract.js), ingen AI, bildet forlater ikke telefonen ---- */
let ocr=null,ocrWorker=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('net'));document.head.appendChild(s)})}
async function prepImage(url){const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const sc=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.drawImage(img,0,0,w,h);
  const im=g.getImageData(0,0,w,h),d=im.data;let lo=255,hi=0;for(let i=0;i<d.length;i+=4){const v=d[i]*.299+d[i+1]*.587+d[i+2]*.114;d[i]=v;if(v<lo)lo=v;if(v>hi)hi=v}
  const k=255/Math.max(1,hi-lo);for(let i=0;i<d.length;i+=4){const v=Math.min(255,Math.max(0,(d[i]-lo)*k));d[i]=d[i+1]=d[i+2]=v}g.putImageData(im,0,0);return cv}
const cleanOcr=l=>l.replace(/[xX*×]/g,' · ').replace(/[—–]/g,'-').replace(/\s*([+\-·:=])\s*/g,' $1 ').replace(/\s+/g,' ').replace(/([+\-·:=])( \1)+/g,'$1').trim();
async function readPhoto(file){const url=URL.createObjectURL(file);ocr={st:'load',url,lines:[]};render();
  try{await loadTess();const cv=await prepImage(url);
    if(!ocrWorker){ocrWorker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'){const p=$('#ocrPct');if(p)p.textContent=Math.round(m.progress*100)+' %'}}});
      await ocrWorker.setParameters({tessedit_char_whitelist:'0123456789+-=xX*/:.,()',tessedit_pageseg_mode:'6'})}
    if(!ocr)return;ocr.st='read';render();const {data}=await ocrWorker.recognize(cv);if(!ocr)return;
    const lines=data.text.split('\n').map(cleanOcr).filter(l=>/\d/.test(l)&&/[+\-·:\/=]/.test(l));
    ocr.st='edit';ocr.none=!lines.length;ocr.lines=lines.length?lines:[''];render()}
  catch(e){if(ocr){ocr.st='err';ocr.lines=[''];render()}}}
function evalExpr(s){const tk=(s.match(/\d+(?:\.\d+)?|[()+\-*\/]/g)||[]).map(x=>/\d/.test(x)?+x:x);if(!tk.length)return null;const r=evalSteps(tk);return r&&!r.div0?r.val:null}
function gradeLine(l){const s=botNorm(l),i=s.indexOf('=');const left=i<0?s:s.slice(0,i),right=i<0?'':s.slice(i+1).trim();
  const v=evalExpr(left);if(v==null)return {st:'?',l};const expl=botMath(left,l)||'';
  if(!/\d/.test(right))return {st:'open',l,v,expl};
  const rm=right.match(/^(\d+)\s*r(?:est)?\s*(\d+)$/),lt=left.match(/^\s*(\d+)\s*\/\s*(\d+)\s*$/);
  if(rm&&lt){const a=+lt[1],b=+lt[2];return {st:+rm[1]===Math.floor(a/b)&&+rm[2]===a%b?'ok':'bad',l,v,expl,show:`${Math.floor(a/b)} rest ${a%b}`}}
  const a=evalExpr(right);return {st:a!=null&&Math.abs(a-v)<1e-6?'ok':'bad',l,v,expl}}
function gradeHtml(lines){const rs=lines.map(x=>x.trim()).filter(Boolean).map(gradeLine);if(!rs.length)return 'Jeg fant ingen regnestykker å rette 🤔';
  const graded=rs.filter(r=>r.st==='ok'||r.st==='bad'),ok=graded.filter(r=>r.st==='ok').length;
  const how=r=>r.expl?`<details><summary class="note" style="cursor:pointer">Vis hvordan</summary><div style="margin-top:6px">${r.expl}</div></details>`:'';
  const row=r=>`<div style="padding:8px 0;border-top:1px solid var(--line)">${r.st==='ok'?`✅ ${esc(r.l)}`:r.st==='bad'?`❌ ${esc(r.l)}<br>Riktig svar er <b>${r.show||fmt(r.v)}</b>${how(r)}`:r.st==='open'?`🧮 ${esc(r.l.replace(/=\s*\??\s*$/,''))} = <b>${fmt(r.v)}</b>${how(r)}`:`❓ «${esc(r.l)}» skjønte jeg ikke. Skriv det inn selv, så hjelper jeg.`}</div>`;
  const head=graded.length?`<b style="font-size:20px">${ok===graded.length?'🎉':'📸'} Du fikk ${ok} av ${graded.length} riktig!</b><br>${ok===graded.length?pick(YAY):ok>=graded.length/2?'Godt jobba! Se på de med ❌, og trykk «Vis hvordan».':'Ingen fare! Feil er trening for hjernen 🧠. Trykk «Vis hvordan» på dem med ❌.'}`:'<b>Her er svarene, steg for steg:</b>';
  return head+rs.map(row).join('')+`<div class="sugg" style="margin-top:10px"><label class="chip" for="botCam">📸 Ta nytt bilde</label><button class="chip" data-sugg="Gi meg en oppgave">Gi meg en oppgave</button></div>`}
function ocrCard(){if(!ocr)return `<div class="card stack" style="gap:8px"><div class="row" style="flex-wrap:nowrap"><div style="font-size:40px">📸</div><div style="min-width:0"><b>Ta bilde av regnestykket</b><div class="note">Kubo leser stykkene på arket og retter dem. Skriv tydelig, ta bildet rett ovenfra i godt lys. Skriv svaret etter =, f.eks. 7 · 8 = 56.</div></div></div>
   <div class="row"><label class="btn gold small" for="botCam">📷 Ta bilde</label><label class="btn ghost small" for="botLib">🖼️ Velg fra bilder</label></div></div>`;
  const busy=ocr.st==='load'||ocr.st==='read';
  return `<div class="card stack" style="gap:10px"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><img src="${ocr.url}" class="thumb" alt="Bildet av arket" style="max-width:110px;margin:0"><div style="min-width:0;flex:1">

     `<b>${ocr.none?'Jeg fant ingen stykker 🤔':'Dette leste Kubo:'}</b><div class="note">${ocr.none?'Skriv stykket selv, eller ta et nytt bilde tettere på.':'Sjekk at det stemmer med arket, og rett opp hvis Kubo leste feil.'} Svaret skrives etter =.</div>`}</div></div>
   ${busy?'':`${ocr.lines.map((l,i)=>`<div class="row" style="flex-wrap:nowrap;gap:6px"><input class="answer ocrLine" data-i="${i}" value="${esc(l)}" placeholder="F.eks. 7 · 8 = 56" style="font-size:18px;text-align:left;flex:1;min-width:0" aria-label="Regnestykke ${i+1}" autocomplete="off"><button class="x" data-ocrdel="${i}" aria-label="Fjern stykke ${i+1}">✕</button></div>`).join('')}

   <div class="row"><button class="btn" id="ocrGo">✅ Rett stykkene</button><button class="btn ghost" id="ocrCancel">Avbryt</button></div>`}</div>`}

  if(id==='unlock'){if($('#pinIn').value.trim()===CFG.pin){parentOpen=true;render()}else{$('#pinIn').classList.add('shake');toast('Feil PIN.')}}
  if(id==='lockP'){parentOpen=false;render()}
  if(id==='savePrizes'){CFG.childName=$('#childName').value.trim();COURSES.forEach(c=>{CFG.prizes[c.id]=$('#pz-'+c.id).value.trim()});if(await saveCfg())toast('Premiene er lagret.');render()}
  const pb=e.target.closest('[data-paid]');if(pb){const c=pb.dataset.paid;CFG.paid[c]=!CFG.paid[c];await saveCfg();render()}
  if(id==='saveKr'){const k=krCfg(),p=parseNum($('#krPer').value),g=parseInt($('#krGoal').value,10),c=parseNum($('#krCap').value||'0');
    if(isNaN(p)||p<0||p>1000||!(g>=1&&g<=200)||isNaN(c)||c<0){toast('Sjekk tallene: beløp 0 eller mer, dagsmål mellom 1 og 200.');return}
    CFG.kr={per:p,goal:g,cap:c,paid:k.paid};if(await saveCfg())toast('Lommepenger er lagret.');render()}
  if(id==='payKr'){const k=krCfg();CFG.kr={...k,paid:+(((S.money&&S.money.total)||0)).toFixed(2)};if(await saveCfg())toast('Markert som utbetalt.');render()}
  if(id==='sndBtn'){S.sound=!S.sound;save();render()}
  if(id==='chgPin'){CFG.pin='';parentOpen=false;await saveCfg();render()}
  if(id==='resetBtn'){if(!resetArm){resetArm=true;render();return}const snd=S.sound;S=blank();S.sound=snd;resetArm=false;save();if(CFG.kr){CFG.kr.paid=0;await saveCfg()}toast('Fremgangen er nullstilt.');render()}
  if(id==='resetNo'){resetArm=false;render()}
  if(id==='bkCopy'){const data='MK1:'+btoa(unescape(encodeURIComponent(JSON.stringify({S,CFG}))));navigator.clipboard.writeText(data).then(()=>toast('Sikkerhetskopien er kopiert. Lim den inn i en melding til deg selv.')).catch(()=>{const t=$('#bkIn');t.value=data;t.select();toast('Marker teksten i feltet og kopier den.')})}
  if(id==='bkLoad'){try{const raw=$('#bkIn').value.trim().replace(/^MK1:/,'');const o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o.S)throw 0;S=hydrate(o.S);if(o.CFG)CFG=Object.assign({pin:'',prizes:{},paid:{}},o.CFG);save();await saveCfg();toast('Fremgangen er gjenopprettet!');render()}catch(_){toast('Koden ser ikke riktig ut. Sjekk at hele teksten er med.')}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pinIn')$('#unlock').click()});

render();
setTimeout(()=>{if(!L&&!SP&&!$('#layer').innerHTML)greet()},700);
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
