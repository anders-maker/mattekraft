<body><title>Mattekraft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=Silkscreen&display=swap">
<style>
/* Layout: one-column "world map" of block-nodes (Duolingo-style path), sticky stats bar on top, app nav fixed at the bottom. */
:root{
  --bg:#EEF5E8; --surface:#FFFFFF; --surface-2:#F6FAF2; --ink:#1E2A1B; --muted:#5D6C58; --line:#D5E1CC;
  --grass:#3FA34D; --grass-l:#6CCB5F; --grass-d:#2B7A36; --dirt:#8B5A2B; --dirt-d:#6A421C;
  --sky:#3E9FDB; --sky-d:#2B7DB3; --gold:#F2B705; --gold-d:#C48F00; --red:#E5484D; --red-d:#B5333A;
  --ok-bg:#DDF5DA; --bad-bg:#FDE2E1; --eye:#18200F;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111711; --surface:#1A221A; --surface-2:#202A20; --ink:#E8F1E4; --muted:#9BB096; --line:#2D3A2C;
  --grass:#4FB95C; --grass-l:#79D46B; --grass-d:#2F8A3C; --dirt:#B07A45; --dirt-d:#86592C;
  --sky:#57B4EC; --sky-d:#3289C0; --gold:#FFC83D; --gold-d:#C9971A; --red:#FF6B6E; --red-d:#C24448;
  --ok-bg:#1D3A1F; --bad-bg:#3F1E1F; --eye:#0E140C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111711; --surface:#1A221A; --surface-2:#202A20; --ink:#E8F1E4; --muted:#9BB096; --line:#2D3A2C;
  --grass:#4FB95C; --grass-l:#79D46B; --grass-d:#2F8A3C; --dirt:#B07A45; --dirt-d:#86592C;
  --sky:#57B4EC; --sky-d:#3289C0; --gold:#FFC83D; --gold-d:#C9971A; --red:#FF6B6E; --red-d:#C24448;
  --ok-bg:#1D3A1F; --bad-bg:#3F1E1F; --eye:#0E140C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.3px;text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;color:var(--grass-d)}
:root[data-theme="dark"] .brand{color:var(--grass-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{color:var(--grass-l)}}
.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--f-pixel);font-size:13px;padding:4px 8px;border-radius:10px;background:var(--surface-2);border:2px solid var(--line);font-variant-numeric:tabular-nums}
@media (max-width:420px){.brand span{display:none}}
main{padding-block:16px 120px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
.nav button{background:none;border:2px solid transparent;border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:12px;color:var(--muted)}
.nav button .ic{font-size:22px;line-height:1.1}
.nav button[aria-current="page"]{color:var(--sky-d);border-color:var(--sky);background:var(--surface-2)}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{color:var(--sky)}}
/* buttons */
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:900;font-size:16px;letter-spacing:.4px;text-transform:uppercase;background:var(--grass);color:#fff;box-shadow:0 4px 0 var(--grass-d);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grass-d)}
.btn[disabled]{background:var(--line);box-shadow:0 4px 0 var(--line);color:var(--muted);cursor:not-allowed}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#2A1E00}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:8px 12px;font-size:13px}
.btn.block{width:100%}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky-d);color:#fff}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
/* path */
.courses{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.course-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--grass);color:#fff;border-radius:18px;padding:16px;box-shadow:0 5px 0 var(--grass-d)}
.course-head h2{font-size:26px}
.course-head>svg{background:var(--surface);border-radius:16px;padding:6px;box-shadow:0 3px 0 var(--grass-d)}
.course-head p{margin:2px 0 0;opacity:.95;font-weight:700}
.prize{margin-top:12px;display:flex;gap:12px;align-items:center;background:var(--surface);border:2px dashed var(--gold);border-radius:16px;padding:12px}
.prize .chest{font-size:34px}
.prize b{display:block}
.meter{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:24px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.node{width:80px;height:76px;border-radius:18px;border:none;font-size:36px;display:grid;place-items:center;position:relative;background:var(--surface);box-shadow:0 6px 0 var(--line),inset 0 0 0 3px var(--line)}
.node.started{background:var(--grass);box-shadow:0 6px 0 var(--grass-d)}
.node.started::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;border-radius:18px 18px 0 0;background:var(--grass-l)}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-d)}
.node.done::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;border-radius:18px 18px 0 0;background:rgba(255,255,255,.35)}
.node span{position:relative}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node-label{font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.crowns{display:flex;gap:3px}
.crowns i{width:12px;height:12px;border-radius:3px;background:var(--line);display:block}
.crowns i.on{background:var(--gold);box-shadow:0 2px 0 var(--gold-d)}
/* sheet / overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,20,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.full{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.full-head{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));max-width:760px;width:100%;margin:0 auto}
.x{background:none;border:none;font-size:26px;color:var(--muted);padding:4px 8px}
.prog{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grass);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.full-body{flex:1;overflow:auto;width:100%}
.full-body .wrap{padding-block:8px 24px}
.qtext{font-size:22px;font-weight:800;line-height:1.35;margin:6px 0 14px}
.vis-box{display:flex;justify-content:center;margin:8px 0 16px;overflow-x:auto}
.vis{max-width:100%;height:auto}
.answer{width:100%;font:inherit;font-size:28px;font-weight:900;text-align:center;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink)}
.answer:focus{border-color:var(--sky);outline:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 10px;font-size:20px;font-weight:900;box-shadow:0 4px 0 var(--line);min-height:60px}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--surface-2);box-shadow:0 4px 0 var(--sky)}
.opt.right{border-color:var(--grass);background:var(--ok-bg)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg)}
.fmt-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.foot{border-top:2px solid var(--line);background:var(--surface)}
.foot .wrap{padding-block:14px;display:flex;flex-direction:column;gap:10px}
.foot.ok{background:var(--ok-bg);border-color:var(--grass)}
.foot.bad{background:var(--bad-bg);border-color:var(--red)}
.fb-title{font-family:var(--f-display);font-size:24px}
.foot.ok .fb-title{color:var(--grass-d)}
.foot.bad .fb-title{color:var(--red)}
:root[data-theme="dark"] .foot.ok .fb-title{color:var(--grass-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .foot.ok .fb-title{color:var(--grass-l)}}
.why{font-weight:700}
.kubo-say{display:flex;gap:10px;align-items:flex-start}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;position:relative;min-width:0;flex:1;white-space:normal;overflow-wrap:anywhere}
.combo{font-family:var(--f-pixel);color:var(--dirt);font-size:14px;white-space:nowrap}
/* learn cards */
.lcard h3{font-size:24px;color:var(--grass-d);margin-bottom:6px}
:root[data-theme="dark"] .lcard h3{color:var(--grass-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lcard h3{color:var(--grass-l)}}
.lcard p{margin:0 0 10px;font-size:18px;max-width:62ch}
.trick{background:var(--surface-2);border-left:6px solid var(--gold);border-radius:10px;padding:10px 12px;font-weight:700;margin:8px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--grass)}
/* trophies */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.trophy{text-align:center;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.trophy .t-ic{font-size:40px;line-height:1.2}
.trophy.locked{opacity:.45;filter:grayscale(1)}
.trophy b{display:block;font-size:15px}
.trophy small{color:var(--muted);display:block;line-height:1.3}
.fgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px;font-family:var(--f-pixel);font-size:11px;text-align:center;max-width:460px}
.fgrid div{aspect-ratio:1;display:grid;place-items:center;border-radius:5px}
.fgrid .h{font-weight:700;color:var(--muted)}
.lv0{background:var(--line)} .lv1{background:#F4C2C2;color:#5a1010} .lv2{background:#F7E08A;color:#3d3000} .lv3{background:var(--grass-l);color:#0d2a0d} .lv4{background:var(--grass);color:#fff}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:17px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--sky);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:4px}
.ask-row{display:flex;gap:8px}
.ask-row textarea{flex:1;min-width:0;font:inherit;font-size:17px;border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical;min-height:52px}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
/* sprint */
.big-timer{font-family:var(--f-pixel);font-size:42px;text-align:center}
.sprint-q{font-family:var(--f-display);font-size:56px;text-align:center}
/* misc */
.center{text-align:center}
.end-ic{font-size:84px;text-align:center;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label.btn{display:inline-block;cursor:pointer}
.thumb{display:block;max-width:220px;max-height:220px;border-radius:12px;margin-bottom:6px;object-fit:cover}
.daily{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.greet-kubo{display:flex;justify-content:center;align-items:flex-start;position:relative;padding-top:6px}
.bob{animation:bob 2.4s ease-in-out infinite}
.wave{font-size:48px;display:inline-block;transform-origin:70% 80%;animation:wave 1.6s ease-in-out infinite;margin-left:-8px}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(18deg)}20%,40%{transform:rotate(-12deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.coltab{font-family:var(--f-pixel);font-size:26px;border-collapse:collapse;margin:0 auto}
.coltab td{padding:2px 8px;text-align:center;min-width:28px}
.coltab tr.sum td{border-top:3px solid var(--ink)}
input.pin{font-family:var(--f-pixel);letter-spacing:6px;font-size:22px;text-align:center;width:160px;padding:10px;border-radius:12px;border:3px solid var(--line);background:var(--surface);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px}
.field input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.status-pill{font-size:12px;font-weight:900;padding:2px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
.pill-ok{background:var(--grass);color:#fff} .pill-wait{background:var(--line);color:var(--muted)} .pill-gold{background:var(--gold);color:#2A1E00}
.note{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:90;max-width:90%}
</style>

<div class="top"><div class="wrap">
  <div class="brand" id="brand"></div>
  <div class="stats" id="stats"></div>
</div></div>
<main class="wrap" id="main"></main>
<nav class="nav" aria-label="Hovedmeny"><div class="wrap" id="nav"></div></nav>
<div id="layer"></div>
<canvas id="confetti" hidden></canvas>

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const fmt=x=>String(+(+x).toFixed(6)).replace('.',',').replace('-','−');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()};
const todayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const frac=(n,d)=>`<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px"><span>${n}</span><span style="border-top:2px solid currentColor;padding:0 3px">${d}</span></span>`;

/* questions */
const N=(q,a,o={})=>({q,a,kind:'num',...o});
const C=(q,a,wrongs,o={})=>{a=String(a);const w=[...new Set(wrongs.map(String))].filter(x=>x!==a).slice(0,3);return {q,a,kind:'choice',opts:shuffle([a,...w]),...o}};
const F=(q,n,d,o={})=>({q,a:[n,d],kind:'frac',show:`${n}/${d}`,...o});
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');if(!/^-?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s)}
function parseFrac(s){s=String(s).replace(/\s/g,'').replace('−','-');const m=s.match(/^(-?\d+)\/(\d+)$/);if(m)return{n:+m[1],d:+m[2]};const x=parseNum(s);return isNaN(x)?null:{n:x,d:1}}
const ints=s=>(String(s).replace('−','-').match(/-?\d+/g)||[]).map(Number);
function check(q,input){
  switch(q.kind){
    case 'num':{const x=parseNum(input);return !isNaN(x)&&Math.abs(x-q.a)<1e-9}
    case 'choice':return input===q.a;
    case 'frac':{const f=parseFrac(input);if(!f||f.d===0)return false;const[an,ad]=q.a;if(q.exact)return f.n===an&&f.d===ad;return Math.abs(f.n/f.d-an/ad)<1e-9}
    case 'mixed':{const v=ints(input);return v.length===3&&v[0]===q.a[0]&&v[1]===q.a[1]&&v[2]===q.a[2]}
    default:{const v=ints(input);return v.length===2&&v[0]===q.a[0]&&v[1]===q.a[1]}
  }
}
const showAns=q=>q.show!=null?q.show:(q.kind==='num'?fmt(q.a):String(q.a));
const fmtHint={num:'Skriv et tall. Bruk komma for desimaler, f.eks. 2,5',frac:'Skriv brøk med skråstrek, f.eks. 3/4',pair:'Skriv f.eks. 3 rest 2',coord:'Skriv f.eks. (3,5)',time:'Skriv klokkeslett, f.eks. 14:30',mixed:'Skriv hele, mellomrom, brøk, f.eks. 1 3/4'};

/* ============ visuals (inline SVG) ============ */
const sv=(w,h,inner,label='')=>`<svg class="vis" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" style="fill:var(--ink);font:800 14px var(--f-body)" text-anchor="middle" ${o}>${t}</text>`;

  tensOnes(n){const h=Math.floor(n/100),t=Math.floor(n%100/10),o=n%10,c=7,H=10*c;let x=6,g='';

    for(let i=0;i<t;i++){g+=`<rect x="${x}" y="6" width="${c}" height="${H}" style="fill:var(--grass);stroke:var(--grass-d);stroke-width:1.5"/>`;for(let k=1;k<10;k++)g+=`<line x1="${x}" y1="${6+k*c}" x2="${x+c}" y2="${6+k*c}" style="stroke:var(--grass-d);stroke-width:.8"/>`;x+=c+6}
    x+=6;for(let i=0;i<o;i++){const col=Math.floor(i/5),row=i%5;g+=`<rect x="${x+col*(c+4)}" y="${6+H-(row+1)*(c+5)+5}" width="${c}" height="${c}" style="fill:var(--gold);stroke:var(--gold-d);stroke-width:1.2"/>`}

  grid(r,c,opt={}){const s=opt.s||Math.min(26,Math.floor(260/Math.max(r,c)));let g='';for(let i=0;i<r;i++)for(let j=0;j<c;j++)g+=block(4+j*(s+3),4+i*(s+3),s,opt.top,opt.body);

  bar(n,d,color='var(--grass)'){const W=300,h=46;let g='';for(let i=0;i<d;i++){const x=4+i*W/d;g+=`<rect x="${x}" y="4" width="${W/d}" height="${h}" style="fill:${i<n?color:'var(--surface)'};stroke:var(--ink);stroke-width:2"/>`}return sv(W+8,h+8,g,`${n} av ${d} deler`)},

      g+=`<path d="M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${d===2?0:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" style="fill:${i<n?'var(--gold)':'var(--surface)'};stroke:var(--dirt-d);stroke-width:2"/>`;

  numline(min,max,opt={}){const W=340,y=40,x0=20,x1=W-20,X=v=>x0+(v-min)/(max-min)*(x1-x0);const step=opt.step||1,lab=opt.label||step;let g=`<line x1="${x0-8}" y1="${y}" x2="${x1+8}" y2="${y}" style="stroke:var(--ink);stroke-width:3"/>`;
    for(let v=min;v<=max+1e-9;v=+(v+step).toFixed(6)){const big=Math.abs(Math.round((v-min)/lab)-(v-min)/lab)<1e-6;g+=`<line x1="${X(v)}" y1="${y-(big?9:5)}" x2="${X(v)}" y2="${y+(big?9:5)}" style="stroke:var(--ink);stroke-width:2"/>`;if(big)g+=T(X(v),y+28,fmt(v))}
    (opt.jumps||[]).forEach(([a,b,t])=>{const xa=X(a),xb=X(b),xm=(xa+xb)/2;g+=`<path d="M${xa} ${y-4} Q${xm} ${y-38} ${xb} ${y-4}" style="fill:none;stroke:var(--sky);stroke-width:3"/>`;if(t)g+=`<text x="${xm}" y="${y-26}" text-anchor="middle" style="fill:var(--sky-d);font:900 13px var(--f-body)">${t}</text>`});

  dec100(k,color='var(--sky)'){const s=20;let g='';for(let c=0;c<10;c++)for(let r=0;r<10;r++){const i=c*10+r;g+=`<rect x="${2+c*s}" y="${2+r*s}" width="${s}" height="${s}" style="fill:${i<k?color:'var(--surface)'};stroke:var(--muted);stroke-width:1"/>`}return sv(10*s+4,10*s+4,g,`${k} av 100 ruter`)},
  clock(h,m){const cx=80,cy=80,r=70;let g=`<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--surface);stroke:var(--ink);stroke-width:5"/>`;

  barChart(data,title=''){const W=320,H=200,b=30,l=34,maxV=Math.max(...data.map(d=>d.v)),top=Math.ceil(maxV/2)*2||2,bw=(W-l-10)/data.length;let g='';

  coord(pts,n=8,line=null){const c=30,o=30,H=o+n*c+10;let g='';for(let i=0;i<=n;i++){g+=`<line x1="${o+i*c}" y1="${H-o}" x2="${o+i*c}" y2="${H-o-n*c}" style="stroke:var(--line);stroke-width:1"/><line x1="${o}" y1="${H-o-i*c}" x2="${o+n*c}" y2="${H-o-i*c}" style="stroke:var(--line);stroke-width:1"/>`;g+=`<text x="${o+i*c}" y="${H-o+18}" text-anchor="middle" style="fill:var(--muted);font:700 12px var(--f-body)">${i}</text>`;if(i)g+=`<text x="${o-10}" y="${H-o-i*c+4}" text-anchor="end" style="fill:var(--muted);font:700 12px var(--f-body)">${i}</text>`}

  angle(deg){const vx=130,vy=150,L=115,a=deg*Math.PI/180;const x2=vx+L*Math.cos(a),y2=vy-L*Math.sin(a),r=30;const ax=vx+r*Math.cos(a),ay=vy-r*Math.sin(a);
