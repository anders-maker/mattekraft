const KUBO=(size=44,mood='happy',skin=(typeof S!=='undefined'&&S.skin)||'gress',hat=(typeof S!=='undefined'&&S.hat)||'ingen')=>{const k=SKINS[skin]||SKINS.gress,h=HATS[hat]||HATS.ingen;return `<svg width="${size}" height="${size}" viewBox="0 -3 48 51" aria-hidden="true" style="flex:none"><rect x="5" y="9" width="38" height="36" rx="7" style="fill:${k.b}"/><rect x="5" y="9" width="38" height="11" rx="6" style="fill:${k.t}"/>${h.s}<rect x="13" y="23" width="7" height="8" rx="2" style="fill:var(--eye)"/><rect x="28" y="23" width="7" height="8" rx="2" style="fill:var(--eye)"/><rect x="15" y="24" width="2.5" height="2.5" style="fill:#fff"/><rect x="30" y="24" width="2.5" height="2.5" style="fill:#fff"/>${mood==='sad'?'<path d="M17 40 q7 -6 14 0" style="fill:none;stroke:var(--eye);stroke-width:3;stroke-linecap:round"/>':'<path d="M16 35 q8 7 16 0" style="fill:none;stroke:var(--eye);stroke-width:3;stroke-linecap:round"/>'}</svg>`};

/* ============ curriculum ============ */
const COURSES=[
 {id:'t2',label:'1.–2. trinn',sub:'Tall, pluss og minus, klokka og former'},
 {id:'t3',label:'3. trinn',sub:'Gangetabellen, deling og store tall'},
 {id:'t4',label:'4. trinn',sub:'Brøk, desimaltall, areal og tid'},
 {id:'t5',label:'5. trinn',sub:'Desimaltall, prosent og negative tall'},
 {id:'t6',label:'6. trinn',sub:'Brøkregning, vinkler, volum og statistikk'}
];
const U=[];const unit=(o)=>U.push(o);
const tr=(t)=>`<div class="trick">💡 ${t}</div>`;

/* ---------- 1.–2. trinn ---------- */
unit({id:'t2-tall',c:'t2',icon:'🧱',title:'Tall opp til 100',
 cards:[
  {h:'Tiere og enere',t:`<p>Tenk deg at du har masse løse blokker. Hver gang du får <b>10 løse blokker</b>, limer du dem sammen til én stang. En stang er en <b>tier</b>.</p><p>Tallet <b>34</b> betyr: 3 stenger (30) og 4 løse blokker (4).</p>`,v:V.tensOnes(34)},
  {h:'Plassen bestemmer verdien',t:`<p>I tallet 34 står 3-tallet på <b>tierplassen</b>, så det er verdt 30. 4-tallet står på <b>enerplassen</b> og er verdt 4.</p><p>Bytter du om til 43, blir det et helt annet tall. Akkurat som at bil nr. 34 og bil nr. 43 ikke er den samme bilen.</p>${tr('Tierplassen er til venstre, enerplassen helt til høyre.')}`},
  {h:'Hvem er størst?',t:`<p>Se på tierne først! 52 og 48: 5 tiere slår 4 tiere, så <b>52 er størst</b>, selv om 8 er større enn 2.</p><p>Bare når tierne er like, ser du på enerne.</p>`,v:V.numline(40,60,{step:1,label:5,marks:[{v:48,l:'48',c:'var(--sky)'},{v:52,l:'52'}]})}
 ],
 gen(l){const T=[
  ()=>{const n=rnd(l===1?11:21,l===1?49:99);return N('Hvor mange blokker er det til sammen?',n,{vis:V.tensOnes(n),hint:'Tell stengene først. Hver stang er 10.',why:`${Math.floor(n/10)} stenger er ${Math.floor(n/10)*10}, pluss ${n%10} løse blokker = ${n}.`})},
  ()=>{const n=rnd(12,98);return N(`Hvor mange <b>tiere</b> er det i tallet ${n}?`,Math.floor(n/10),{hint:'Tierne står til venstre.',why:`${n} = ${Math.floor(n/10)} tiere og ${n%10} enere.`})},
  ()=>{let a=rnd(10,99),b=rnd(10,99);while(a===b)b=rnd(10,99);return C(`Hvilket tall er størst: ${a} eller ${b}?`,Math.max(a,b),[Math.min(a,b)],{hint:'Sammenlign tierne først.',why:`${Math.max(a,b)} har ${Math.floor(Math.max(a,b)/10)>Math.floor(Math.min(a,b)/10)?'flere tiere':'like mange tiere, men flere enere'}.`})},
  ()=>{const n=rnd(2,9)*10-1;return N(`Hvilket tall kommer rett etter ${n}?`,n+1,{hint:'Når enerne er 9 og du legger til 1, blir det en ny tier.',why:`${n} + 1 = ${n+1}. Ti enere blir til en ny tier.`})},
  ()=>{const t=rnd(2,9),o=rnd(0,9);return N(`${t} tiere og ${o} enere. Hvilket tall er det?`,t*10+o,{why:`${t} tiere = ${t*10}. ${t*10} + ${o} = ${t*10+o}.`})}
 ];return pick(l===1?T.slice(0,2):l===2?T.slice(0,4):T.slice(1))()}});

unit({id:'t2-pluss20',c:'t2',icon:'➕',title:'Pluss og minus til 20',
 cards:[
  {h:'Tiervenner',t:`<p>Noen tall er bestevenner fordi de blir <b>10</b> sammen:</p><p style="font-size:22px;font-weight:900">1+9 · 2+8 · 3+7 · 4+6 · 5+5</p><p>De hører sammen som bil og ratt. Lær dem utenat – de hjelper deg med nesten all pluss og minus.</p>`,v:V.bar(7,10,'var(--grass)')},
  {h:'Fyll opp til 10 først',t:`<p><b>8 + 5</b>: 8 trenger 2 for å bli 10. Ta 2 av femmeren, så har du 3 igjen.</p><p>8 + 2 = 10, og 10 + 3 = <b>13</b>.</p>`,v:V.numline(5,15,{jumps:[[8,10,'+2'],[10,13,'+3']],marks:[{v:13,l:'13'}]})},
  {h:'Minus er å gå bakover',t:`<p>Du har 12 kjeks og spiser 4. <b>12 − 4</b>: Gå først ned til 10 (spis 2), så 2 til. Da er du på <b>8</b>.</p>${tr('Minus? Gå ned til 10 først, så resten.')}`,v:V.numline(5,15,{jumps:[[12,10,'−2'],[10,8,'−2']],marks:[{v:8,l:'8'}]})}
 ],
 gen(l){if(l===1){if(Math.random()<.5){const a=rnd(1,9);return N(`${a} + ? = 10`,10-a,{hint:'Hvem er tiervennen til '+a+'?',why:`${a} og ${10-a} er tiervenner: ${a} + ${10-a} = 10.`})}const a=rnd(1,9),b=rnd(1,10-a);return N(`${a} + ${b} = ?`,a+b,{vis:V.emojiRow('🍪',a)+'<div class="center" style="font-weight:900">+</div>'+V.emojiRow('🍪',b),why:`Tell videre fra ${a}: ${a+b}.`})}
  if(l===2){const a=rnd(6,9),b=rnd(11-a,9);return N(`${a} + ${b} = ?`,a+b,{hint:`Fyll opp til 10 først: ${a} + ${10-a} = 10.`,why:`${a} + ${10-a} = 10, og så ${b-(10-a)} til: ${a+b}.`})}
  const s=rnd(11,18),b=rnd(s-9,9);if(Math.random()<.5)return N(`${s} − ${b} = ?`,s-b,{hint:`Gå ned til 10 først (ta bort ${s-10}).`,why:`${s} − ${s-10} = 10, og 10 − ${b-(s-10)} = ${s-b}.`});return N(`? + ${b} = ${s}`,s-b,{hint:'Hva må du starte på for å havne på '+s+'?',why:`${s} − ${b} = ${s-b}. Sjekk: ${s-b} + ${b} = ${s}.`})}});

unit({id:'t2-pluss100',c:'t2',icon:'🚗',title:'Pluss og minus til 100',
 cards:[
  {h:'Hopp med tierne',t:`<p>En bil kjører 38 km og så 25 km til. <b>38 + 25</b>:</p><p>Hopp først med tierne: 38 + 20 = 58. Så enerne: 58 + 5 = <b>63</b>.</p>`,v:V.numline(30,70,{step:1,label:10,jumps:[[38,58,'+20'],[58,63,'+5']],marks:[{v:63,l:'63'}]})},
  {h:'Minus-triks: ta litt for mye',t:`<p><b>72 − 28</b>: 28 er nesten 30. Ta bort 30: 72 − 30 = 42. Men du tok 2 for mye, så gi dem tilbake: 42 + 2 = <b>44</b>.</p>${tr('9, 19, 29 … er nesten tiere. Regn med tieren og juster etterpå.')}`},
  {h:'Sjekk svaret',t:`<p>Pluss og minus er motsatte. Har du regnet 72 − 28 = 44, kan du sjekke: 44 + 28 = 72. Stemmer!</p>`}
 ],
 gen(l){const a=rnd(l===1?10:15,l===1?40:70),b=rnd(l===1?10:11,l===1?40:Math.min(29,99-a));
  if(l===1)return N(`${a} + ${b} = ?`,a+b,{hint:'Legg sammen tierne først, så enerne.',why:`${a} + ${Math.floor(b/10)*10} = ${a+Math.floor(b/10)*10}, så + ${b%10} = ${a+b}.`});
  if(l===2){const x=rnd(41,95),y=rnd(11,x-10);return N(`${x} − ${y} = ?`,x-y,{hint:'Ta bort tierne først, så enerne.',why:`${x} − ${Math.floor(y/10)*10} = ${x-Math.floor(y/10)*10}, så − ${y%10} = ${x-y}.`})}
  const S=pick([()=>{const p=rnd(25,60),q=rnd(15,35);return N(`En Minecraft-kiste har ${p} jernbarrer. Du legger inn ${q} til. Hvor mange er det nå?`,p+q,{why:`${p} + ${q} = ${p+q}.`})},()=>{const p=rnd(50,99),q=rnd(12,45);return N(`Bilen har ${p} liter bensin og bruker ${q} liter. Hvor mye er igjen?`,p-q,{why:`${p} − ${q} = ${p-q}.`})},()=>{const p=rnd(30,80),q=rnd(11,29);return N(`Du har ${p} kr og kjøper en burger til ${q} kr. Hvor mye har du igjen?`,p-q,{why:`${p} − ${q} = ${p-q}.`})}]);return S()}});

unit({id:'t2-monster',c:'t2',icon:'🔁',title:'Tallmønstre',
 cards:[
  {h:'Finn regelen',t:`<p>Et mønster er en regel som gjentas, som en turner som gjør samme serie igjen og igjen.</p><p style="font-size:22px;font-weight:900">2, 4, 6, 8, …</p><p>Hva skjer fra tall til tall? <b>+2</b> hver gang. Neste tall blir 10.</p>`,v:V.numline(0,12,{jumps:[[2,4,'+2'],[4,6,'+2'],[6,8,'+2'],[8,10,'+2']]})},
  {h:'Partall og oddetall',t:`<p><b>Partall</b> kan deles i to like store hauger: 2, 4, 6, 8, 10 … De ender på 0, 2, 4, 6 eller 8.</p><p><b>Oddetall</b> får én til overs: 1, 3, 5, 7, 9 …</p>${tr('Se bare på det siste sifferet! 358 er partall fordi det ender på 8.')}`}
 ],
 gen(l){if(Math.random()<.3){const n=rnd(10,l===3?999:99);return C(`Er ${n} et partall eller et oddetall?`,n%2?'Oddetall':'Partall',['Partall','Oddetall'],{why:`${n} ender på ${n%10}, og det er ${n%2?'et oddetall':'et partall'}.`})}
  const st=l===1?pick([2,5,10]):l===2?pick([3,4,5,10,-2,-5]):pick([3,4,6,7,9,25,-3,-10]);const s0=st<0?rnd(40,90):rnd(0,20);const seq=[0,1,2,3].map(i=>s0+i*st);
  return N(`Hva er neste tall? <br><span style="font-size:28px">${seq.join(', ')}, …</span>`,s0+4*st,{hint:'Hvor mye endrer tallet seg hver gang?',why:`Regelen er ${st>0?'+':'−'}${Math.abs(st)}. ${seq[3]} ${st>0?'+':'−'} ${Math.abs(st)} = ${s0+4*st}.`})}});

unit({id:'t2-klokka',c:'t2',icon:'⏰',title:'Klokka: hel, halv og kvart',
 cards:[
  {h:'To visere',t:`<p>Den <b>korte</b> viseren viser timene. Den <b>lange</b> viseren viser minuttene.</p><p>Når den lange peker rett opp på 12, er klokka <b>hel</b>. Her er klokka 3.</p>`,v:V.clock(3,0)},
  {h:'«Halv» betyr halvveis TIL',t:`<p>På norsk sier vi «halv fire» når klokka er <b>3:30</b>. Det betyr: halvveis til fire.</p><p>Den lange viseren peker ned på 6, og den korte står midt mellom 3 og 4.</p>${tr('Halv fire = 3:30. Tenk: «halvveis til fire».')}`,v:V.clock(3,30)},
  {h:'Kvart over og kvart på',t:`<p><b>Kvart over</b> = 15 minutter over. Kvart over 3 = 3:15.</p><p><b>Kvart på</b> = 15 minutter før. Kvart på 4 = 3:45.</p><p>En kvart er en fjerdedel av en time, som en fjerdedel av en pizza.</p>`,v:V.clock(3,15)}
 ],
 gen(l){const h=rnd(1,12),m=l===1?0:l===2?pick([0,30]):pick([15,30,45]);const nm=['','ett','to','tre','fire','fem','seks','sju','åtte','ni','ti','elleve','tolv'];const nx=h%12+1;
  const name=(h,m)=>m===0?`${nm[h]}`:m===30?`halv ${nm[h%12+1]}`:m===15?`kvart over ${nm[h]}`:`kvart på ${nm[h%12+1]}`;
  const wr=[name(h%12+1,m),name(h,(m+30)%60),name(nx%12+1,m),m===30?nm[h]:name(h,m===15?45:15)];
  return C('Hva er klokka?','Klokka '+name(h,m),wr.map(w=>'Klokka '+w),{vis:V.clock(h,m),hint:'Se på den korte viseren for timen, den lange for minuttene.',why:`Den korte viseren er ved ${h}${m?'–'+nx:''}, og den lange peker på ${m===0?'12':m/5}. Det er ${h}:${String(m).padStart(2,'0')}, altså «${name(h,m)}».`})}});

unit({id:'t2-former',c:'t2',icon:'🔺',title:'Former og figurer',
 cards:[
  {h:'Hjørner og sider',t:`<p>En <b>trekant</b> har 3 sider og 3 hjørner. En <b>firkant</b> har 4. En <b>femkant</b> har 5, og en <b>sekskant</b> 6 (som i en bikube).</p><p>En <b>sirkel</b> har ingen hjørner – den er helt rund, som et bilhjul.</p>`,v:V.shape(6)},
  {h:'Kvadrat eller rektangel?',t:`<p>Begge er firkanter med rette hjørner. Et <b>kvadrat</b> har fire <b>like lange</b> sider, som siden på en Minecraft-blokk. Et <b>rektangel</b> har to lange og to korte sider, som en dør.</p>`,v:V.shape('rektangel')},
  {h:'3D-figurer',t:`<p>En <b>kube</b> er en terning – akkurat som en Minecraft-blokk: 6 flater, 8 hjørner. En <b>kule</b> er en ball. En <b>sylinder</b> er som en brusboks.</p>`,v:V.box(1,1,1)}
 ],
 gen(l){const P=[[3,'trekant'],[4,'firkant'],[5,'femkant'],[6,'sekskant'],[8,'åttekant']];
  if(l===1){const [n,nm]=pick(P.slice(0,4));return C('Hva heter denne figuren?',nm[0].toUpperCase()+nm.slice(1),P.map(p=>p[1][0].toUpperCase()+p[1].slice(1)),{vis:V.shape(n),hint:'Tell hjørnene.',why:`Den har ${n} hjørner, så den er en ${nm}.`})}
  if(l===2){const [n,nm]=pick(P);return N(`Hvor mange hjørner har en ${nm}?`,n,{why:`«${nm[0].toUpperCase()+nm.slice(1,-4)}» sier det: ${n} hjørner.`})}
  return pick([()=>N('Hvor mange flater har en kube (en Minecraft-blokk)?',6,{why:'Topp, bunn og 4 sider = 6 flater.'}),()=>N('Hvor mange hjørner har en kube?',8,{why:'4 hjørner oppe og 4 nede = 8.'}),()=>C('Hvilken figur har 4 like lange sider og rette hjørner?','Kvadrat',['Rektangel','Trekant','Sekskant'],{why:'Et kvadrat har fire like lange sider.'}),()=>C('Hvilken 3D-figur ligner en brusboks?','Sylinder',['Kule','Kube','Kjegle'],{why:'En brusboks er rund med flat topp og bunn: en sylinder.'})])()}});

unit({id:'t2-lengde',c:'t2',icon:'📏',title:'Måle lengde',
 cards:[
  {h:'Centimeter',t:`<p>Én <b>centimeter (cm)</b> er omtrent like bred som neglen på lillefingeren din. En Lego-kloss er ca. 3 cm.</p><p>Legg linjalen med <b>0</b> ved starten av tingen du måler!</p>`,v:V.ruler(7)},
  {h:'Meter',t:`<p>1 <b>meter</b> = 100 cm. En vanlig bil er ca. 4 meter lang. En voksen er nesten 2 meter høy.</p>${tr('Kort ting? cm. Lang ting? m.')}`}
 ],
 gen(l){if(l===1){const n=rnd(2,11);return N('Hvor lang er blyanten i cm?',n,{vis:V.ruler(n),hint:'Les av tallet der blyanten slutter.',why:`Blyanten starter på 0 og slutter på ${n}.`})}
  if(l===2){const m=rnd(1,9);return N(`${m} m = ? cm`,m*100,{hint:'1 m = 100 cm.',why:`${m} · 100 = ${m*100} cm.`})}
  return pick([()=>C('Hvor lang er en vanlig bil?','Ca. 4 m',['Ca. 4 cm','Ca. 40 m','Ca. 400 m'],{why:'En bil er omtrent 4 meter.'}),()=>C('Hvor lang er en blyant?','Ca. 15 cm',['Ca. 15 m','Ca. 1 cm','Ca. 150 cm'],{why:'En blyant er ca. 15 cm.'}),()=>{const c=rnd(2,9)*100;return N(`${c} cm = ? m`,c/100,{why:`100 cm = 1 m, så ${c} cm = ${c/100} m.`})}])()}});

/* ---------- 3. trinn ---------- */
unit({id:'t3-tall1000',c:'t3',icon:'🏰',title:'Tall opp til 1000',
 cards:[
  {h:'Hundrere',t:`<p>10 stenger limt sammen blir en <b>plate</b> = 100 blokker.</p><p>Tallet <b>347</b> er 3 plater, 4 stenger og 7 løse blokker.</p>`,v:V.tensOnes(347)},
  {h:'Del opp tallet',t:`<p>347 = <b>300 + 40 + 7</b>. Dette kalles <i>utvidet form</i>. Det hjelper når du skal regne i hodet.</p>${tr('Hundrere – tiere – enere. Fra venstre mot høyre.')}`}
 ],
 gen(l){const n=rnd(101,999),h=Math.floor(n/100),t=Math.floor(n/10)%10,o=n%10;
  if(l===1)return N('Hvilket tall viser blokkene?',n,{vis:V.tensOnes(n),hint:'Plate = 100, stang = 10, liten blokk = 1.',why:`${h}·100 + ${t}·10 + ${o} = ${n}.`});
  if(l===2)return pick([()=>N(`Hva er verdien av sifferet ${h} i ${n}?`,h*100,{why:`${h} står på hundrerplassen, så det er verdt ${h*100}.`}),()=>N(`${h*100} + ${t*10} + ${o} = ?`,n,{why:`Sett sammen: ${n}.`})])();
  return pick([()=>N(`Hva er 100 mer enn ${n}?`,n+100,{why:'Bare hundrersifferet øker med 1.'}),()=>N(`Hva er 10 mindre enn ${n}?`,n-10,{why:'Tiersifferet går ned med 1.'}),()=>{let m=rnd(101,999);return C(`Hvilket tall er størst: ${n} eller ${m}?`,Math.max(n,m),[Math.min(n,m)],{why:'Sammenlign hundrerne først, så tierne, så enerne.'})}])()}});

unit({id:'t3-oppstilling',c:'t3',icon:'🧮',title:'Oppstilling: mente og låning',
 cards:[
  {h:'Enere under enere',t:`<p>Når du stiller opp, må enerne stå under enerne og tierne under tierne. Så regner du fra <b>høyre</b> mot venstre.</p>`,v:V.column(256,137,'+')},
  {h:'Mente: veksle 10 til én',t:`<p>6 + 7 = 13 enere. Det er for mange for én plass! Vi bytter 10 enere til 1 tier – akkurat som å smelte 10 jernbarrer til én jernblokk.</p><p>Skriv <b>3</b> nederst, og en liten <b>1</b> (menten) over tierne.</p><p>256 + 137 = <b>393</b>.</p>`},
  {h:'Låning: bytt én til 10',t:`<p><b>52 − 18</b>: Du kan ikke ta 8 fra 2. Lån en tier: den blir til 10 enere. Nå har du 12 − 8 = 4, og 4 tiere − 1 tier = 3.</p><p>Svar: <b>34</b>.</p>${tr('Sjekk minus med pluss: 34 + 18 = 52 ✔')}`}
 ],
 gen(l){const add=l===3?Math.random()<.5:l===1;let a,b;
  if(add){a=rnd(l===1?110:150,l===1?499:799);b=rnd(100,999-a)}else{a=rnd(300,999);b=rnd(101,a-50)}
  return N('Regn ut:',add?a+b:a-b,{vis:V.column(a,b,add?'+':'−'),hint:add?'Start med enerne. Over 9? Skriv en mente.':'Start med enerne. For lite? Lån fra naboen.',why:`${a} ${add?'+':'−'} ${b} = ${add?a+b:a-b}. Sjekk: ${add?`${a+b} − ${b} = ${a}`:`${a-b} + ${b} = ${a}`}.`})}});

function multQ(tables,l,showGrid){const a=pick(tables),b=rnd(1,10);const [x,y]=Math.random()<.5?[a,b]:[b,a];
  if(l===3&&Math.random()<.5){return N(`? · ${y} = ${x*y}`,x,{fact:[x,y],hint:`Hvilket tall ganger ${y} blir ${x*y}?`,why:`${x} · ${y} = ${x*y}, så tallet som mangler er ${x}.`})}
  return N(`${x} · ${y} = ?`,x*y,{fact:[x,y],vis:showGrid?V.grid(x,y):'',hint:tipFor(x,y),why:whyMult(x,y)})}
function tipFor(x,y){const m=Math.max(x,y),n=Math.min(x,y);
  if(n===1)return 'Én gang noe er bare seg selv.';if(n===10||m===10)return 'Ganger med 10? Heng på en null!';if(n===2||m===2)return 'Ganger med 2 = dobling.';
  if(n===5||m===5)return 'Fem-gangen: halvparten av ti-gangen.';if(x===9||y===9)return 'Ni-gangen: ta ti-gangen og trekk fra én gruppe.';
  if(x===4||y===4)return 'Fire-gangen: doble to ganger.';return 'Del opp: bruk et tall du kan, og legg til eller trekk fra én gruppe.'}
function whyMult(x,y){const p=x*y,m=Math.max(x,y),n=Math.min(x,y);
  if(n===1)return `${x} · ${y} = ${p}.`;if(m===10)return `${n} · 10 = ${n} med en null bak = ${p}.`;if(n===2)return `${m} · 2 = ${m} + ${m} = ${p}.`;
  if(n===5)return `${m} · 10 = ${m*10}, og halvparten av det er ${p}.`;if(m===9)return `${n} · 10 = ${n*10}, minus én ${n}-er = ${p}.`;
  if(n===4)return `${m} · 2 = ${m*2}, doble det: ${p}.`;if(n===3)return `${m} + ${m} + ${m} = ${p}.`;
  if(n===8||m===8){const o=n===8?m:n;return `${o} · 4 = ${o*4}, doble det: ${p}.`}
  if(n===6)return `${m} · 5 = ${m*5}, pluss én ${m}-er til = ${p}.`;return `${n} · ${m} = ${p}. ${p===56?'Husk: 5, 6, 7, 8 → 56 = 7 · 8!':''}`}
unit({id:'t3-gange1',c:'t3',icon:'✖️',title:'Gangetabellen 1–5 og 10',
 cards:[
  {h:'Gange = like grupper',t:`<p>Du åpner <b>3 kister</b>, og i hver ligger det <b>4 diamanter</b>. Hvor mange diamanter har du?</p><p>4 + 4 + 4 = 12. Det kan vi skrive kortere: <b>3 · 4 = 12</b>.</p><p>Ganging er bare superrask pluss!</p>`,v:V.grid(3,4,{top:'var(--sky)',body:'var(--sky-d)'})},
  {h:'Byttetrikset',t:`<p>Snu rutenettet på siden: 3 rader med 4 blir 4 rader med 3. Det er like mange blokker!</p><p>Så <b>3 · 4 = 4 · 3</b>. Kan du den ene, kan du den andre gratis. Det halverer gangetabellen.</p>`,v:V.grid(4,3)},
  {h:'Superkrefter for 2, 5 og 10',t:`${tr('<b>10-gangen:</b> heng på en null. 7 · 10 = 70.')}${tr('<b>2-gangen:</b> doble. 2 · 8 = 8 + 8 = 16.')}${tr('<b>5-gangen:</b> halvparten av 10-gangen. 5 · 8 → 80 delt på 2 = 40. Svarene ender alltid på 0 eller 5.')}${tr('<b>4-gangen:</b> doble, og doble igjen. 4 · 7 → 14 → 28.')}`},
  {h:'Tabellen som et kart',t:`<p>Under <b>Pokaler</b> finner du gangetabell-kartet ditt. Rutene blir grønne etter hvert som du kan dem. Målet er et helt grønt kart!</p>`}
 ],
 gen(l){return multQ([1,2,3,4,5,10],l,l===1)}});

unit({id:'t3-gange2',c:'t3',icon:'🔥',title:'Gangetabellen 6–9',
 cards:[
  {h:'Du kan mer enn du tror',t:`<p>Med byttetrikset og 2-, 5- og 10-gangen kan du allerede det meste. Det er bare <b>10 «vanskelige»</b> igjen:</p><p style="font-weight:900">6·6 6·7 6·8 6·9 7·7 7·8 7·9 8·8 8·9 9·9</p><p>10 stykker. Det klarer du!</p>`},
  {h:'9-gangen: fingertrikset',t:`<p>Hold opp 10 fingre. For <b>9 · 4</b>: bøy ned finger nummer 4. Fingre til venstre = 3 (tiere), til høyre = 6 (enere). <b>36</b>!</p>${tr('I 9-gangen blir sifrene alltid 9 til sammen: 36 → 3+6 = 9. Og tieren er én mindre enn tallet du ganger med.')}`},
  {h:'6-gangen: 5-gangen + én til',t:`<p><b>6 · 7</b> = 5 · 7 + 7 = 35 + 7 = <b>42</b>.</p><p>Tenk: 5 biler med 7 hestekrefter … pluss én bil til.</p>`,v:V.grid(6,7)},
  {h:'8-gangen: doble tre ganger',t:`<p><b>8 · 6</b>: 6 → 12 → 24 → <b>48</b>. Doble, doble, doble!</p>${tr('7 · 8 = 56. Husk rekka 5, 6, 7, 8: «56 = 7 · 8».')}`}
 ],
 gen(l){return multQ(l===1?[6,9]:[6,7,8,9],l,l===1)}});

unit({id:'t3-deling',c:'t3',icon:'🍕',title:'Deling: rettferdig fordeling',
 cards:[
  {h:'Del likt',t:`<p>Du har <b>12 pizzabiter</b> og <b>3 venner</b>. Del ut én og én, rundt og rundt, til alt er borte. Alle får <b>4</b>.</p><p>Vi skriver <b>12 : 3 = 4</b>.</p>`,v:V.grid(3,4,{top:'var(--gold)',body:'var(--red)'})},
  {h:'Deling er gange baklengs',t:`<p>For å regne <b>20 : 4</b> spør du: «Hva ganger 4 blir 20?» 5 · 4 = 20, så svaret er <b>5</b>.</p>${tr('Kan du gangetabellen, kan du deling. Det er samme tabell!')}`}
 ],
 gen(l){const b=rnd(2,l===1?5:10),q=rnd(1,10),a=b*q;
  if(l===3&&Math.random()<.6)return pick([()=>N(`${a} kjeks deles likt på ${b} venner. Hvor mange får hver?`,q,{fact:[b,q],why:`${a} : ${b} = ${q}, fordi ${q} · ${b} = ${a}.`}),()=>N(`Et lag på ${b} turnere trenger ${a} matter til sammen. Hvor mange matter per turner?`,q,{fact:[b,q],why:`${a} : ${b} = ${q}.`})])();
  return N(`${a} : ${b} = ?`,q,{fact:[b,q],vis:l===1?V.grid(b,q,{top:'var(--gold)',body:'var(--red)'}):'',hint:`Hva ganger ${b} blir ${a}?`,why:`${q} · ${b} = ${a}, så ${a} : ${b} = ${q}.`})}});

unit({id:'t3-maling',c:'t3',icon:'⚖️',title:'Vekt og volum',
 cards:[
  {h:'Gram og kilogram',t:`<p>Et eple veier ca. <b>150 gram</b>. En liter melk veier ca. <b>1 kilogram</b>.</p><p><b>1 kg = 1000 g</b>. «Kilo» betyr tusen.</p>`},
  {h:'Desiliter og liter',t:`<p>Et vanlig glass rommer ca. <b>2 dl</b>. En melkekartong rommer <b>1 liter</b>.</p><p><b>1 l = 10 dl</b>. Fem glass fyller nesten en kartong.</p>${tr('kilo = 1000. deci = en tiendedel.')}`}
 ],
 gen(l){if(l===1){const k=rnd(1,9);return Math.random()<.5?N(`${k} kg = ? g`,k*1000,{why:`1 kg = 1000 g, så ${k} kg = ${k*1000} g.`}):N(`${k} l = ? dl`,k*10,{why:`1 l = 10 dl, så ${k} l = ${k*10} dl.`})}
  if(l===2)return pick([()=>C('Hva veier en sekk poteter?','5 kg',['5 g','500 kg','50 g'],{why:'En sekk poteter veier noen kilo.'}),()=>C('Hvor mye rommer et glass?','2 dl',['2 l','20 l','2 ml'],{why:'Et vanlig glass er ca. 2 dl.'}),()=>C('Hva veier en bil?','1200 kg',['1200 g','12 kg','120 g'],{why:'Biler veier over tusen kilo.'})])();
  const g=rnd(2,8)*1000;return pick([()=>N(`${g} g = ? kg`,g/1000,{why:`1000 g = 1 kg.`}),()=>{const d=rnd(2,9)*10;return N(`${d} dl = ? l`,d/10,{why:'10 dl = 1 l.'})},()=>{const x=rnd(2,6);return N(`Oppskriften trenger ${x} dl melk per pannekakeporsjon. Hvor mange dl trenger du til 5 porsjoner?`,x*5,{why:`${x} · 5 = ${x*5} dl.`})}])()}});

unit({id:'t3-diagram',c:'t3',icon:'📊',title:'Tabeller og søylediagram',
 cards:[
  {h:'Les et søylediagram',t:`<p>Klassen stemte på favorittmat. Jo høyere søyle, jo flere stemmer. Følg toppen av søylen bort til tallet på siden.</p>`,v:V.barChart([{l:'Pizza',v:8},{l:'Taco',v:6},{l:'Sushi',v:3},{l:'Burger',v:5}],'Favorittmat')},
  {h:'Tellestreker',t:`<p>Når du teller, kan du lage streker: |||| og den femte på skrå over. Da er det lett å telle i femmere.</p>`}
 ],
 gen(l){const foods=shuffle(['Pizza','Taco','Sushi','Burger','Pasta','Vafler']).slice(0,4);const data=foods.map(f=>({l:f,v:rnd(1,10)}));const vis=V.barChart(data,'Diagram');
  const mx=data.reduce((a,b)=>b.v>a.v?b:a);const tie=data.filter(d=>d.v===mx.v).length>1;
  if(l===1||tie){const d=pick(data);return N(`Hvor mange stemte på ${d.l}?`,d.v,{vis,why:`Søylen for ${d.l} går opp til ${d.v}.`})}
  if(l===2)return C('Hvilken mat fikk flest stemmer?',mx.l,foods,{vis,why:`${mx.l} har høyeste søyle med ${mx.v}.`});
  const [a,b]=shuffle(data);return pick([()=>N(`Hvor mange flere stemte på ${a.v>=b.v?a.l:b.l} enn på ${a.v>=b.v?b.l:a.l}?`,Math.abs(a.v-b.v),{vis,why:`${Math.max(a.v,b.v)} − ${Math.min(a.v,b.v)} = ${Math.abs(a.v-b.v)}.`}),()=>N('Hvor mange stemte til sammen?',data.reduce((s,d)=>s+d.v,0),{vis,why:`${data.map(d=>d.v).join(' + ')} = ${data.reduce((s,d)=>s+d.v,0)}.`})])()}});

/* ---------- 4. trinn ---------- */
unit({id:'t4-store',c:'t4',icon:'🚀',title:'Store tall og avrunding',
 cards:[
  {h:'Tusener',t:`<p>10 hundrere blir <b>1000</b>. I tallet <b>4 527</b> står 4 på tusenplassen. Vi lager et lite mellomrom etter tusenet så det blir lettere å lese.</p>`},
  {h:'Avrunding',t:`<p>Bilen kjører i 87 km/t. Omtrent hvor fort? Ligger 87 nærmest 80 eller 90? <b>90</b>!</p>${tr('Se på sifferet rett til høyre: 0–4 → ned. 5–9 → opp.')}`,v:V.numline(80,90,{marks:[{v:87,l:'87'}]})}
 ],
 gen(l){if(l===1){const x=rnd(12,98);return N(`Rund av ${x} til nærmeste tier.`,Math.round(x/10)*10,{vis:V.numline(Math.floor(x/10)*10,Math.floor(x/10)*10+10,{marks:[{v:x,l:String(x)}]}),hint:'Se på enersifferet.',why:`Enersifferet er ${x%10}, så vi runder ${x%10>=5?'opp':'ned'} til ${Math.round(x/10)*10}.`})}
  if(l===2){const x=rnd(101,989);return N(`Rund av ${x} til nærmeste hundrer.`,Math.round(x/100)*100,{hint:'Se på tiersifferet.',why:`Tiersifferet er ${Math.floor(x/10)%10}, så vi runder ${Math.floor(x/10)%10>=5?'opp':'ned'} til ${Math.round(x/100)*100}.`})}
  const x=rnd(1001,9899);return pick([()=>N(`Rund av ${x} til nærmeste tusen.`,Math.round(x/1000)*1000,{why:`Hundrersifferet er ${Math.floor(x/100)%10}, så det blir ${Math.round(x/1000)*1000}.`}),()=>N(`Hva er verdien av sifferet ${Math.floor(x/1000)} i ${x}?`,Math.floor(x/1000)*1000,{why:'Det står på tusenplassen.'})])()}});

unit({id:'t4-gange',c:'t4',icon:'💎',title:'Gange med større tall',
 cards:[
  {h:'Del opp tallet',t:`<p><b>23 · 4</b>: Del 23 i 20 og 3.</p><p>20 · 4 = 80 og 3 · 4 = 12. Legg sammen: 80 + 12 = <b>92</b>.</p><p>Tenk: 4 kister med 23 smaragder: 4 kister med 20, pluss 4 kister med 3.</p>`,v:`<div style="display:flex;gap:4px;align-items:flex-end;justify-content:center;font-weight:900"><div style="width:160px;height:64px;background:var(--grass);color:#fff;display:grid;place-items:center;border-radius:6px">20 · 4 = 80</div><div style="width:44px;height:64px;background:var(--gold);color:#2A1E00;display:grid;place-items:center;border-radius:6px;font-size:13px">3·4=12</div></div>`},
  {h:'Gange med 10 og 100',t:`<p>Gange med 10: heng på én null. 34 · 10 = 340.<br>Gange med 100: heng på to nuller. 34 · 100 = 3400.</p>${tr('30 · 4? Regn 3 · 4 = 12, og heng på nullen: 120.')}`}
 ],
 gen(l){if(l===1){const a=rnd(2,9),t=pick([10,20,30,40,50]);return N(`${a} · ${t} = ?`,a*t,{hint:`Regn ${a} · ${t/10}, og heng på en null.`,why:`${a} · ${t/10} = ${a*t/10}, med null bak: ${a*t}.`})}
  if(l===2){const a=rnd(12,49),b=rnd(2,9),t=Math.floor(a/10)*10,o=a%10;return N(`${a} · ${b} = ?`,a*b,{hint:`Del opp: ${t} · ${b} og ${o} · ${b}.`,why:`${t} · ${b} = ${t*b}, ${o} · ${b} = ${o*b}. ${t*b} + ${o*b} = ${a*b}.`})}
  return pick([()=>{const a=rnd(101,399),b=rnd(2,6);const h=Math.floor(a/100)*100,r=a%100;return N(`${a} · ${b} = ?`,a*b,{why:`${h} · ${b} = ${h*b}, ${r} · ${b} = ${r*b}. Til sammen ${a*b}.`})},()=>{const a=rnd(12,99);const m=pick([10,100]);return N(`${a} · ${m} = ?`,a*m,{why:`Heng på ${m===10?'én null':'to nuller'}: ${a*m}.`})}])()}});

unit({id:'t4-rest',c:'t4',icon:'🥚',title:'Deling med rest',
 cards:[
  {h:'Når det ikke går opp',t:`<p>Du har <b>17 egg</b> og eggekartonger som tar <b>5</b>. Du fyller 3 kartonger (15 egg), og <b>2 egg</b> blir til overs.</p><p>17 : 5 = <b>3 rest 2</b>.</p>`,v:V.emojiRow('🥚',17,5)},
  {h:'Sjekk med gange',t:`<p>3 kartonger · 5 egg = 15, pluss 2 i rest = 17 ✔.</p>${tr('Resten må alltid være mindre enn tallet du deler på.')}`}
 ],
 gen(l){const b=rnd(2,l===1?5:9),q=rnd(2,l===3?12:9),r=rnd(1,b-1),a=b*q+r;
  return {q:l===3?`${a} biler skal parkeres i rader med ${b} i hver. Hvor mange fulle rader blir det, og hvor mange biler blir til overs?`:`${a} : ${b} = ? rest ?`,a:[q,r],kind:'pair',show:`${q} rest ${r}`,vis:l===1?V.emojiRow('🥚',a,b):'',hint:`Hvor mange ganger går ${b} opp i ${a}? Gangetabellen: ${b}·${q}=${b*q}.`,why:`${b} · ${q} = ${b*q}. ${a} − ${b*q} = ${r} til overs. Svar: ${q} rest ${r}.`}}});

unit({id:'t4-brok',c:'t4',icon:'🍕',title:'Brøk: del av en hel',
 cards:[
  {h:'Teller og nevner',t:`<p>En pizza er skåret i <b>8 like biter</b>. Du spiser <b>3</b>. Du har spist ${frac(3,8)} av pizzaen.</p><p><b>Nevneren</b> (nederst) sier hvor mange like biter helheten er delt i. <b>Telleren</b> (øverst) sier hvor mange biter vi snakker om.</p>`,v:V.pie(3,8)},
  {h:'Større nevner = mindre biter!',t:`<p>Vil du heller ha ${frac(1,4)} eller ${frac(1,8)} av en pizza? Deler vi i 8, blir bitene <b>mindre</b> enn om vi deler i 4.</p><p>Så ${frac(1,4)} er <b>større</b> enn ${frac(1,8)}. Det lurer mange!</p>`,v:V.bar(1,4,'var(--gold)')+V.bar(1,8,'var(--gold)')},
  {h:'Brøkstreken er en deling',t:`<p>${frac(1,2)} betyr 1 delt på 2. Én pizza delt på to personer gir en halv pizza hver.</p>${tr('Når telleren og nevneren er like, har du en hel: 8/8 = 1.')}`}
 ],
 gen(l){if(l<3){const d=pick(l===1?[2,3,4,6,8]:[3,4,5,6,8,10,12]),n=rnd(1,d-1);return F(l===1?'Hvor stor del av pizzaen er markert?':'Hvor stor del av stangen er farget?',n,d,{vis:l===1?V.pie(n,d):V.bar(n,d),hint:'Tell alle bitene (nevner) og de fargede (teller).',why:`Det er ${d} like deler, og ${n} er farget: ${n}/${d}.`})}
  return pick([()=>{const[a,b]=shuffle([2,3,4,5,6,8,10]).slice(0,2);return C(`Hvilken brøk er størst: 1/${a} eller 1/${b}?`,`1/${Math.min(a,b)}`,[`1/${Math.max(a,b)}`],{why:`Jo færre biter, jo større er hver bit. 1/${Math.min(a,b)} er størst.`})},()=>{const d=pick([4,6,8]);return N(`Hvor mange åttendedeler er en hel pizza?`.replace('åttendedeler',d===4?'fjerdedeler':d===6?'sjettedeler':'åttendedeler'),d,{why:`${d}/${d} = 1 hel.`})},()=>{const d=pick([3,4,5,6,8]),n=rnd(1,d-1);return F(`Du har spist ${n} av ${d} biter. Hvor stor del av pizzaen er <b>igjen</b>?`,d-n,d,{vis:V.pie(d-n,d),why:`${d} − ${n} = ${d-n} biter igjen: ${d-n}/${d}.`})}])()}});

unit({id:'t4-desimal',c:'t4',icon:'🏎️',title:'Desimaltall: tideler',
 cards:[
  {h:'Kommaet',t:`<p>Kommaet skiller <b>hele</b> fra <b>deler</b>. En sprinter løper 100 meter på 9,8 sekunder: 9 hele sekunder og 8 tideler.</p>`},
  {h:'Tideler',t:`<p>Del 1 i 10 like deler. Hver del er <b>0,1</b> (en tidel) = ${frac(1,10)}.</p><p>0,7 betyr 7 tideler = ${frac(7,10)}.</p>`,v:V.numline(0,1,{step:.1,label:.5,marks:[{v:.7,l:'0,7'}]})},
  {h:'Penger er desimaltall',t:`<p>12,50 kr er 12 kroner og 50 øre. Halvparten av en krone er 0,50 kr = 0,5 kr.</p>${tr('0,5 er det samme som en halv.')}`}
 ],
 gen(l){if(l===1){const k=rnd(1,9);return N('Hvilket tall viser den røde prikken?',k/10,{vis:V.numline(0,1,{step:.1,label:.5,marks:[{v:k/10}]}),hint:'Hvert lite steg er 0,1.',why:`Prikken står ${k} steg fra 0. ${k} tideler = ${fmt(k/10)}.`})}
  if(l===2){const k=rnd(1,9);return Math.random()<.5?N(`Skriv ${k}/10 som desimaltall.`,k/10,{why:`${k} tideler = ${fmt(k/10)}.`}):F(`Skriv ${fmt(k/10)} som brøk med nevner 10.`,k,10,{exact:true,why:`${fmt(k/10)} er ${k} tideler = ${k}/10.`})}
  const a=rnd(1,49)/10,b=rnd(1,49)/10;if(a===b)return N('Hva er 0,5 + 0,5?',1,{why:'To halve blir én hel.'});return pick([()=>C(`Hvilket tall er størst: ${fmt(a)} eller ${fmt(b)}?`,fmt(Math.max(a,b)),[fmt(Math.min(a,b))],{why:'Sammenlign de hele først, så tidelene.'}),()=>{const x=rnd(1,20)/10*1,y=rnd(1,9)/10;return N(`${fmt(x)} + ${fmt(y)} = ?`,+(x+y).toFixed(1),{why:`Legg sammen tidelene: ${fmt(+(x+y).toFixed(1))}.`})}])()}});

unit({id:'t4-areal',c:'t4',icon:'🟩',title:'Omkrets og areal',
 cards:[
  {h:'Omkrets = gjerdet rundt',t:`<p>Du bygger et gjerde rundt hagen din i Minecraft. Hvor mange gjerdebiter trenger du? Det er <b>omkretsen</b>: summen av alle sidene.</p><p>En hage på 5 · 3 har omkrets 5 + 3 + 5 + 3 = <b>16</b>.</p>`,v:V.grid(3,5)},
  {h:'Areal = gulvet inni',t:`<p>Hvor mange gressblokker trenger du for å dekke hele gulvet? Det er <b>arealet</b>.</p><p>3 rader med 5 blokker: 3 · 5 = <b>15</b>.</p>${tr('Areal i et rektangel = lengde · bredde. Omkrets = alle sidene lagt sammen.')}`}
 ],
 gen(l){const w=rnd(2,l===1?6:9),h=rnd(2,l===1?5:8);const vis=l<3?V.grid(h,w):`<div class="center" style="font-weight:900;font-size:20px">Rektangel: ${w} m lang og ${h} m bred</div>`;
  return Math.random()<.5?N(`Hva er <b>arealet</b>${l<3?' (antall blokker)':' i m²'}?`,w*h,{vis,hint:'Lengde · bredde.',why:`${w} · ${h} = ${w*h}.`}):N(`Hva er <b>omkretsen</b>${l<3?' (antall blokkesider rundt)':' i meter'}?`,2*(w+h),{vis,hint:'Legg sammen alle fire sidene.',why:`${w} + ${h} + ${w} + ${h} = ${2*(w+h)}.`})}});

unit({id:'t4-koord',c:'t4',icon:'🗺️',title:'Koordinatsystem',
 cards:[
  {h:'Først bortover, så opp',t:`<p>Et punkt skrives som <b>(x, y)</b>. x er hvor langt <b>bortover</b> du går. y er hvor langt <b>opp</b>.</p><p>Tenk: først går du langs gangen, så tar du heisen opp. Punktet A er (3, 5).</p>`,v:V.coord([{x:3,y:5,l:'A'}])},
  {h:'Minecraft bruker koordinater',t:`<p>I Minecraft kan du se koordinatene dine (x, y, z). Slik finner du tilbake til basen din! I matte på skolen bruker vi bare x og y.</p>${tr('«Gå før du flyr»: x først, så y.')}`}
 ],
 gen(l){const x=rnd(0,8),y=rnd(0,8);
  if(l<3)return {q:'Hva er koordinatene til punktet A?',a:[x,y],kind:'coord',show:`(${x}, ${y})`,vis:V.coord([{x,y,l:'A'}]),hint:'Først bortover (x), så opp (y).',why:`A står ${x} bortover og ${y} opp: (${x}, ${y}).`};
  const pts=[];const L=['A','B','C'];while(pts.length<3){const p={x:rnd(0,8),y:rnd(0,8)};if(!pts.some(q=>q.x===p.x&&q.y===p.y)&&!pts.some(q=>q.x===p.y&&q.y===p.x))pts.push(p)}pts.forEach((p,i)=>p.l=L[i]);const t=pick(pts);
  return C(`Hvilket punkt har koordinatene (${t.x}, ${t.y})?`,t.l,L,{vis:V.coord(pts),why:`Gå ${t.x} bortover og ${t.y} opp. Der står ${t.l}.`})}});

unit({id:'t4-tid',c:'t4',icon:'⏱️',title:'Tid og tidsregning',
 cards:[
  {h:'60 minutter',t:`<p>1 time = <b>60 minutter</b>. 1 minutt = 60 sekunder. En halv time = 30 minutter, et kvarter = 15 minutter.</p>`},
  {h:'Hvor lang tid?',t:`<p>Turntreningen er fra <b>17:15</b> til <b>18:45</b>. Hvor lenge varer den?</p><p>Hopp i hele timer først: 17:15 → 18:15 = 60 min. Så resten: 18:15 → 18:45 = 30 min. Til sammen <b>90 minutter</b>.</p>`},
  {h:'Over timeskiftet',t:`<p>Klokka er 9:50. Hva er den om 25 minutter? 9:50 + 10 min = 10:00. Så 15 min til: <b>10:15</b>.</p>${tr('Hopp til hel time først, så resten.')}`}
 ],
 gen(l){if(l===1)return pick([()=>{const h=rnd(2,5);return N(`${h} timer = ? minutter`,h*60,{why:`${h} · 60 = ${h*60}.`})},()=>N('Hvor mange minutter er et kvarter?',15,{why:'En kvart time = 60 : 4 = 15 minutter.'}),()=>N('Hvor mange minutter er en halv time?',30,{why:'60 : 2 = 30.'})])();
  const h=rnd(7,20),m=pick([0,10,15,20,30,40,45,50]);const d=l===2?pick([15,20,30,45]):pick([25,35,50,75,90,105]);const t2=h*60+m+d;const H=Math.floor(t2/60)%24,M=t2%60;const pad=x=>String(x).padStart(2,'0');
  if(Math.random()<.5)return {q:`Klokka er ${pad(h)}:${pad(m)}. Hva er klokka om ${d} minutter?`,a:[H,M],kind:'time',show:`${pad(H)}:${pad(M)}`,hint:'Hopp til hel time først.',why:`${pad(h)}:${pad(m)} + ${d} min = ${pad(H)}:${pad(M)}.`};
  return N(`Fotballkampen starter ${pad(h)}:${pad(m)} og slutter ${pad(H)}:${pad(M)}. Hvor mange minutter varer den?`,d,{hint:'Hopp i hele timer, så resten.',why:`Fra ${pad(h)}:${pad(m)} til ${pad(H)}:${pad(M)} er det ${d} minutter.`})}});

/* ---------- 5. trinn ---------- */
unit({id:'t5-desimal',c:'t5',icon:'🔢',title:'Desimaltall: plassverdi',
 cards:[
  {h:'Tideler og hundredeler',t:`<p>Et turnapparat gir poengsum <b>13,45</b>. Det er 13 hele, 4 <b>tideler</b> og 5 <b>hundredeler</b>.</p><p>I rutenettet er hele ruta 1. Hver kolonne er 0,1, og hver liten rute er 0,01.</p>`,v:V.dec100(45)},
  {h:'Fellen: 0,8 eller 0,75?',t:`<p>Mange tror 0,75 er størst fordi 75 er større enn 8. <b>Feil!</b></p><p>Legg til en null så de har like mange siffer: 0,80 og 0,75. Nå ser du at <b>0,80 er størst</b>.</p>${tr('Fyll på med nuller bak kommaet til tallene er like lange. En null bakerst endrer ikke verdien.')}`,v:V.dec100(80,'var(--grass)')+' '+V.dec100(75)},
  {h:'Plassene etter kommaet',t:`<p>Første plass etter kommaet = <b>tideler</b>. Andre plass = <b>hundredeler</b>. Tredje = <b>tusendeler</b>.</p><p>I 2,37 er 3-tallet verdt 0,3, og 7-tallet er verdt 0,07.</p>`}
 ],
 gen(l){if(l===1){const k=rnd(5,95);return N('Hvor stor del av ruta er farget? Skriv som desimaltall.',k/100,{vis:V.dec100(k),hint:'Hver kolonne er 0,1, hver liten rute 0,01.',why:`${k} av 100 ruter = ${fmt(k/100)}.`})}
  if(l===2){let a=rnd(1,9)/10,b=rnd(11,99)/100;if(Math.abs(a-b)<1e-9)b+=.01;return C(`Hvilket tall er størst: ${fmt(a)} eller ${fmt(b)}?`,fmt(Math.max(a,b)),[fmt(Math.min(a,b))],{hint:'Fyll på med null så de blir like lange.',why:`${fmt(a)} = ${a.toFixed(2).replace('.',',')}. Sammenlign ${a.toFixed(2).replace('.',',')} og ${b.toFixed(2).replace('.',',')}: ${fmt(Math.max(a,b))} er størst.`})}
  const x=rnd(101,999)/100;const d1=Math.floor(x*10)%10,d2=Math.round(x*100)%10;return pick([()=>N(`Hva er verdien av sifferet ${d2} i ${fmt(x)}? (Skriv som desimaltall)`,d2/100,{why:`${d2} står på hundredelsplassen: ${fmt(d2/100)}.`}),()=>N(`Hva er ${fmt(x)} + 0,1?`,+(x+.1).toFixed(2),{why:'Tidelsifferet øker med 1.'}),()=>{const v=[x,+(x+rnd(1,9)/100).toFixed(2),+(x-rnd(1,9)/10).toFixed(2)];const s=v.slice().sort((a,b)=>a-b);return C('Hvilket tall er minst?',fmt(s[0]),v.map(fmt),{why:`Sortert: ${s.map(fmt).join(' < ')}.`})}])()}});

unit({id:'t5-desregn',c:'t5',icon:'🛒',title:'Regne med desimaltall',
 cards:[
  {h:'Komma under komma',t:`<p>Du handler taco: lefser til <b>24,90 kr</b> og ost til <b>42,50 kr</b>. Still opp med kommaet rett under kommaet, og regn som vanlig.</p><p>24,90 + 42,50 = <b>67,40 kr</b>.</p>`,v:V.column('24,90','42,50','+')},
  {h:'Tomme plasser = null',t:`<p><b>5 − 1,3</b>: Skriv 5 som 5,0. Da blir det 5,0 − 1,3 = <b>3,7</b>.</p>${tr('Kommaet i svaret står rett under kommaene over.')}`}
 ],
 gen(l){const dp=l===1?1:2;const r=n=>+n.toFixed(dp);const a=r(rnd(10,l===3?999:99)/(10**dp)*(l===1?1:1)),b=r(rnd(10,l===3?500:90)/(10**dp));
  if(l===3&&Math.random()<.5){const p=r(rnd(1500,9900)/100);const q=r(rnd(500,p*100-100)/100);return N(`Du har ${fmt(p)} kr og kjøper en pizza til ${fmt(q)} kr. Hvor mye har du igjen?`,r(p-q),{why:`${fmt(p)} − ${fmt(q)} = ${fmt(r(p-q))}.`})}
  if(Math.random()<.5||a<b)return N(`${fmt(a)} + ${fmt(b)} = ?`,r(a+b),{vis:l<3?V.column(a.toFixed(dp).replace('.',','),b.toFixed(dp).replace('.',','),'+'):'',hint:'Komma under komma.',why:`${fmt(a)} + ${fmt(b)} = ${fmt(r(a+b))}.`});
  return N(`${fmt(a)} − ${fmt(b)} = ?`,r(a-b),{vis:l<3?V.column(a.toFixed(dp).replace('.',','),b.toFixed(dp).replace('.',','),'−'):'',hint:'Komma under komma. Fyll inn null der det mangler.',why:`${fmt(a)} − ${fmt(b)} = ${fmt(r(a-b))}.`})}});

unit({id:'t5-likebrok',c:'t5',icon:'🍫',title:'Like brøker og forkorting',
 cards:[
  {h:'Samme mengde, flere biter',t:`<p>Del en sjokolade i 2 og ta én bit: ${frac(1,2)}. Del den i 4 og ta to biter: ${frac(2,4)}. Du har fått <b>like mye sjokolade</b>!</p>`,v:V.bar(1,2,'var(--dirt)')+V.bar(2,4,'var(--dirt)')+V.bar(4,8,'var(--dirt)')},
  {h:'Utvide: gang oppe og nede',t:`<p>Gang teller og nevner med <b>samme tall</b>, så får du en like stor brøk:</p><p>${frac(1,3)} = ${frac('1·2','3·2')} = ${frac(2,6)}</p>`},
  {h:'Forkorte: del oppe og nede',t:`<p>Del teller og nevner med samme tall: ${frac(6,8)} = ${frac('6:2','8:2')} = ${frac(3,4)}.</p>${tr('Forkort så langt du kan. Finn et tall som går opp i både teller og nevner.')}`}
 ],
 gen(l){if(l===1){const d=pick([2,3,4,5]),n=rnd(1,d-1),k=rnd(2,4);return N(`${n}/${d} = ?/${d*k}`,n*k,{vis:V.bar(n,d,'var(--dirt)')+V.bar(n*k,d*k,'var(--dirt)'),hint:`Nevneren ble ganget med ${k}. Gjør det samme med telleren.`,why:`${d} · ${k} = ${d*k}, så ${n} · ${k} = ${n*k}.`})}
  if(l===2){const d=pick([2,3,4,5,6]),n=rnd(1,d-1),k=rnd(2,5);const g=gcd(n,d);return F(`Forkort ${n*k}/${d*k} så mye som mulig.`,n/g,d/g,{exact:true,hint:`Hvilket tall går opp i både ${n*k} og ${d*k}?`,why:`Del oppe og nede med ${k*g}: ${n*k}:${k*g} = ${n/g}, ${d*k}:${k*g} = ${d/g}.`})}
  const[a,b,c,d]=[rnd(1,5),pick([3,4,5,6,8]),rnd(1,5),pick([3,4,5,6,8])];if(a>=b||c>=d||a*d===c*b)return C('Er 2/4 og 1/2 like store?','Ja',['Nei'],{why:'2/4 forkortet med 2 blir 1/2.'});const big=a/b>c/d?`${a}/${b}`:`${c}/${d}`;
  return C(`Hvilken brøk er størst: ${a}/${b} eller ${c}/${d}?`,big,[`${a}/${b}`,`${c}/${d}`],{vis:V.bar(a,b)+V.bar(c,d,'var(--sky)'),hint:'Se på stengene, eller gjør nevnerne like.',why:`${a}/${b} = ${fmt(+(a/b).toFixed(2))} og ${c}/${d} = ${fmt(+(c/d).toFixed(2))}. ${big} er størst.`})}});

unit({id:'t5-prosent',c:'t5',icon:'🔋',title:'Prosent',
 cards:[
  {h:'Prosent = av hundre',t:`<p>«Pro cent» betyr «av hundre». <b>45 %</b> betyr 45 av 100 ruter.</p><p>Batteriet på elbilen viser 45 %: litt under halvfullt.</p>`,v:V.dec100(45,'var(--grass)')},
  {h:'Viktige prosenter',t:`<p><b>100 %</b> = alt. <b>50 %</b> = halvparten. <b>25 %</b> = en fjerdedel. <b>10 %</b> = en tiendedel.</p>${tr('10 % av et tall: del på 10. 10 % av 300 kr = 30 kr.')}`},
  {h:'Salg i butikken',t:`<p>Et spill koster 400 kr, og det er <b>25 % rabatt</b>. 25 % er en fjerdedel: 400 : 4 = 100 kr rabatt. Du betaler 300 kr.</p>`}
 ],
 gen(l){if(l===1){const k=rnd(5,95);return N('Hvor mange prosent av ruta er farget?',k,{vis:V.dec100(k,'var(--grass)'),why:`${k} av 100 ruter = ${k} %.`})}
  if(l===2){const p=pick([50,25,10]),v=p===50?rnd(2,40)*2:p===25?rnd(2,25)*4:rnd(2,50)*10;return N(`Hva er ${p} % av ${v}?`,v*p/100,{hint:p===50?'Halvparten.':p===25?'En fjerdedel: del på 4.':'Del på 10.',why:`${p} % = ${p===50?'1/2':p===25?'1/4':'1/10'}. ${v} : ${100/p} = ${v*p/100}.`})}
  return pick([()=>{const v=rnd(2,9)*100,p=pick([10,20,25,50]);return N(`Et spill koster ${v} kr. Det er ${p} % rabatt. Hvor mye koster det nå?`,v-v*p/100,{why:`${p} % av ${v} = ${v*p/100}. ${v} − ${v*p/100} = ${v-v*p/100}.`})},()=>{const a=rnd(1,19)*5;return C(`Hva er ${a} % som brøk av 100?`,`${a}/100`,[`${a}/10`,`1/${a}`,`${100-a}/100`],{why:`Prosent betyr hundredeler: ${a} % = ${a}/100.`})},()=>{const n=pick([20,25,50,10]);const k=rnd(1,n-1);return N(`${k} av ${n} elever liker pizza best. Hvor mange prosent er det?`,k*100/n,{why:`${k}/${n} = ${k*100/n}/100 = ${k*100/n} %.`})}])()}});

unit({id:'t5-negative',c:'t5',icon:'⛏️',title:'Negative tall',
 cards:[
  {h:'Under null',t:`<p>Om vinteren kan det være <b>−5 °C</b>: fem grader <i>under</i> null. I Minecraft graver du dypt ned under havnivå, og y-koordinaten blir negativ.</p>`,v:V.thermo(-5)},
  {h:'Tallinja fortsetter',t:`<p>Til venstre for 0 kommer −1, −2, −3 … Jo lenger til venstre, jo <b>mindre</b> er tallet.</p><p>Så −3 er <b>større</b> enn −7, akkurat som −3 °C er varmere enn −7 °C.</p>`,v:V.numline(-8,4,{marks:[{v:-7,l:'−7',c:'var(--sky)'},{v:-3,l:'−3'}]})},
  {h:'Hvor langt er det?',t:`<p>Fra −4 °C til 6 °C: Først 4 grader opp til 0, så 6 til. Til sammen <b>10 grader</b>.</p>${tr('Gå via null!')}`,v:V.numline(-5,7,{jumps:[[-4,0,'+4'],[0,6,'+6']]})}
 ],
 gen(l){if(l===1){const t=rnd(-15,15);return N('Hvor mange grader viser termometeret?',t,{vis:V.thermo(t),hint:'Under null? Husk minustegnet.',why:`Den røde søylen står ved ${fmt(t)} °C.`})}
  if(l===2){let a=rnd(-10,5),b=rnd(-10,5);while(a===b)b=rnd(-10,5);return C(`Hvilket tall er størst: ${fmt(a)} eller ${fmt(b)}?`,fmt(Math.max(a,b)),[fmt(Math.min(a,b))],{vis:V.numline(-10,5,{marks:[{v:a,l:fmt(a),c:'var(--sky)'},{v:b,l:fmt(b)}]}),why:`${fmt(Math.max(a,b))} står lengst til høyre på tallinja.`})}
  return pick([()=>{const a=rnd(-9,-1),b=rnd(1,9);return N(`Det er ${fmt(a)} °C om morgenen og ${b} °C om ettermiddagen. Hvor mange grader steg temperaturen?`,b-a,{why:`Fra ${fmt(a)} til 0 er ${-a}, fra 0 til ${b} er ${b}. ${-a} + ${b} = ${b-a}.`})},()=>{const a=rnd(1,8),b=rnd(a+1,12);return N(`Det er ${a} °C og temperaturen synker ${b} grader. Hva blir temperaturen?`,a-b,{why:`${a} − ${b} = ${fmt(a-b)}.`})},()=>{const y=rnd(-50,-10),d=rnd(5,20);return N(`Steve står på y = ${fmt(y)} og graver ${d} blokker rett ned. Hva blir y?`,y-d,{why:`${fmt(y)} − ${d} = ${fmt(y-d)}.`})}])()}});

unit({id:'t5-snitt',c:'t5',icon:'🤸',title:'Gjennomsnitt',
 cards:[
  {h:'Del rettferdig',t:`<p>Tre turnere fikk <b>6, 8 og 10</b> poeng. Legg alt i én haug: 6 + 8 + 10 = 24. Del likt på 3: 24 : 3 = <b>8</b>.</p><p>Gjennomsnittet er 8.</p>`,v:V.barChart([{l:'Ida',v:6},{l:'Ali',v:8},{l:'Jon',v:10}],'Poeng')},
  {h:'Oppskrift',t:`${tr('1) Legg sammen alle tallene. 2) Del på hvor mange tall det er.')}<p>Gjennomsnittet er det alle ville fått hvis vi jevnet ut søylene.</p>`}
 ],
 gen(l){const n=l===1?2:l===2?3:pick([4,5]);const m=rnd(3,l===3?20:12);let v=Array.from({length:n},()=>m+rnd(-3,3));const diff=m*n-v.reduce((a,b)=>a+b,0);v[0]+=diff;if(v[0]<0)v[0]=0;const s=v.reduce((a,b)=>a+b,0);
  if(s%n)return N(`Hva er gjennomsnittet av ${m} og ${m}?`,m,{why:`${m} + ${m} = ${2*m}, delt på 2 = ${m}.`});
  return N(`${l===3?'Målene i serien var':'Finn gjennomsnittet av'}: <b>${v.join(', ')}</b>${l===3?'. Hva er gjennomsnittet?':''}`,s/n,{vis:l<3?V.barChart(v.map((x,i)=>({l:String.fromCharCode(65+i),v:x}))):'',hint:'Legg sammen, og del på hvor mange tall det er.',why:`${v.join(' + ')} = ${s}. ${s} : ${n} = ${s/n}.`})}});

unit({id:'t5-ukjent',c:'t5',icon:'🕵️',title:'Den ukjente: enkle likninger',
 cards:[
  {h:'Hva er i kista?',t:`<p>Noen har gjemt et tall i en kiste: <b>▢ + 7 = 15</b>. Hvilket tall er det?</p><p>Spør: «Hva + 7 blir 15?» Svaret er <b>8</b>.</p>`,v:V.balance('▢ + 7','15')},
  {h:'Gjør det motsatte',t:`<p>Står det <b>+ 7</b>? Gjør det motsatte: 15 − 7 = 8.<br>Står det <b>· 4</b>? Del: 20 : 4 = 5.</p><p>Vi bruker ofte bokstaven <b>x</b> i stedet for en kiste.</p>${tr('Sjekk alltid: sett tallet inn og se om det stemmer.')}`}
 ],
 gen(l){const x=rnd(2,12);if(l===1){const a=rnd(2,15);return Math.random()<.5?N(`▢ + ${a} = ${x+a}`,x,{hint:`Regn ${x+a} − ${a}.`,why:`${x+a} − ${a} = ${x}. Sjekk: ${x} + ${a} = ${x+a}.`}):N(`▢ − ${a} = ${x}`,x+a,{hint:`Gjør det motsatte: ${x} + ${a}.`,why:`${x} + ${a} = ${x+a}.`})}
  if(l===2){const a=rnd(2,9);return Math.random()<.5?N(`${a} · x = ${a*x}. Hva er x?`,x,{fact:[a,x],hint:`Del ${a*x} på ${a}.`,why:`${a*x} : ${a} = ${x}.`}):N(`x : ${a} = ${x}. Hva er x?`,a*x,{fact:[a,x],why:`Gjør det motsatte: ${x} · ${a} = ${a*x}.`})}
  const a=rnd(2,5),b=rnd(1,10);return N(`${a}x + ${b} = ${a*x+b}. Hva er x?`,x,{hint:`Fjern først + ${b}, så del på ${a}.`,why:`${a*x+b} − ${b} = ${a*x}. ${a*x} : ${a} = ${x}.`})}});

/* ---------- 6. trinn ---------- */
unit({id:'t6-ti',c:'t6',icon:'⚡',title:'Gange og dele med 10, 100, 1000',
 cards:[
  {h:'Kommaet hopper',t:`<p>Når du ganger med 10, blir tallet 10 ganger større: kommaet hopper <b>ett steg til høyre</b>.</p><p>3,7 · 10 = 37 &nbsp;·&nbsp; 3,7 · 100 = 370 (fyll inn null).</p>`},
  {h:'Dele = hopp til venstre',t:`<p>Deler du med 10, hopper kommaet ett steg til <b>venstre</b>: 45 : 10 = 4,5.<br>45 : 100 = 0,45.</p>${tr('Tell nullene! 1000 har tre nuller = tre hopp.')}`}
 ],
 gen(l){const m=pick(l===1?[10]:[10,100,1000]);const mul=l===1?Math.random()<.6:Math.random()<.5;const x=l===1?rnd(11,99)/10:rnd(101,9999)/100;
  if(mul)return N(`${fmt(x)} · ${m} = ?`,+(x*m).toFixed(4),{hint:`Kommaet hopper ${String(m).length-1} steg til høyre.`,why:`${fmt(x)} · ${m} = ${fmt(+(x*m).toFixed(4))}. Kommaet flyttet seg ${String(m).length-1} plass(er) til høyre.`});
  const y=l===1?rnd(11,999):rnd(11,9999);return N(`${y} : ${m} = ?`,+(y/m).toFixed(4),{hint:`Kommaet hopper ${String(m).length-1} steg til venstre.`,why:`${y} : ${m} = ${fmt(y/m)}.`})}});

unit({id:'t6-brokregn',c:'t6',icon:'🧁',title:'Pluss og minus med brøk',
 cards:[
  {h:'Lik nevner: tell biter',t:`<p>${frac(2,8)} + ${frac(3,8)}: Du har 2 åttedels-biter og får 3 til. Nå har du 5 biter: ${frac(5,8)}.</p><p>Nevneren endres <b>ikke</b>! Bitene blir ikke større av at du får flere av dem.</p>`,v:V.bar(5,8,'var(--gold)')},
  {h:'Ulik nevner: gjør bitene like',t:`<p>${frac(1,2)} + ${frac(1,4)}: Halve og fjerdedeler kan ikke telles sammen. Gjør om ${frac(1,2)} til ${frac(2,4)}.</p><p>${frac(2,4)} + ${frac(1,4)} = ${frac(3,4)}.</p>${tr('Feilen alle gjør: 1/2 + 1/4 = 2/6. NEI! Ikke legg sammen nevnerne.')}`,v:V.bar(2,4)+V.bar(1,4,'var(--sky)')}
 ],
 gen(l){if(l===1){const d=pick([4,5,6,8,10,12]),a=rnd(1,d-2),b=rnd(1,d-1-a);return Math.random()<.6?F(`${a}/${d} + ${b}/${d} = ?`,a+b,d,{hint:'Tell bitene. Nevneren blir den samme.',why:`${a} + ${b} = ${a+b} biter: ${a+b}/${d}.`}):F(`${a+b}/${d} − ${b}/${d} = ?`,a,d,{why:`${a+b} − ${b} = ${a}: ${a}/${d}.`})}
  const d1=pick([2,3,4,5]),k=pick([2,3]),d2=d1*k,a=rnd(1,d1-1),b=rnd(1,d2-1);const A=a*k;
  if(l===2||A+b>d2*1.5){if(A+b<=d2)return F(`${a}/${d1} + ${b}/${d2} = ?`,A+b,d2,{hint:`Gjør om ${a}/${d1} til ${d2}-deler.`,why:`${a}/${d1} = ${A}/${d2}. ${A}/${d2} + ${b}/${d2} = ${A+b}/${d2}.`});}
  if(A>b)return F(`${a}/${d1} − ${b}/${d2} = ?`,A-b,d2,{hint:`Gjør om ${a}/${d1} til ${d2}-deler.`,why:`${a}/${d1} = ${A}/${d2}. ${A} − ${b} = ${A-b}: ${A-b}/${d2}.`});
  return F(`${a}/${d1} + ${b}/${d2} = ?`,A+b,d2,{why:`${a}/${d1} = ${A}/${d2}. ${A}/${d2} + ${b}/${d2} = ${A+b}/${d2}.`})}});

unit({id:'t6-brokav',c:'t6',icon:'💰',title:'Brøkdel av et antall',
 cards:[
  {h:'Del først, gang så',t:`<p>Du har 20 diamanter og skal gi bort ${frac(3,4)}. Hvor mange er det?</p><p>1) <b>Del på nevneren:</b> 20 : 4 = 5 (det er én fjerdedel).<br>2) <b>Gang med telleren:</b> 5 · 3 = <b>15</b>.</p>`,v:V.grid(4,5,{top:'var(--sky)',body:'var(--sky-d)'})},
  {h:'Hurtigtriks',t:`${tr('«Del nede, gang oppe.» Først nevner, så teller.')}<p>${frac(2,3)} av 12 kr: 12 : 3 = 4, 4 · 2 = 8 kr.</p>`}
 ],
 gen(l){const d=pick(l===1?[2,3,4,5]:[3,4,5,6,8,10]),n=l===1?1:rnd(1,d-1),one=rnd(2,l===3?16:10),tot=d*one;
  if(l===3&&Math.random()<.6)return pick([()=>{const[sn,sd]=pick([[1,2],[1,4],[3,4],[1,8],[3,8],[5,8]]);return N(`En stack i Minecraft er 64 blokker. Hvor mange blokker er ${sn}/${sd} av en stack?`,64/sd*sn,{why:`64 : ${sd} = ${64/sd}. ${64/sd} · ${sn} = ${64/sd*sn}.`})},()=>N(`Turnlaget har ${tot} medlemmer. ${n}/${d} av dem konkurrerer. Hvor mange er det?`,n*one,{why:`${tot} : ${d} = ${one}. ${one} · ${n} = ${n*one}.`})])();
  return N(`Hva er ${n}/${d} av ${tot}?`,n*one,{vis:l===1?V.grid(d,one,{top:'var(--sky)',body:'var(--sky-d)'}):'',hint:`Del ${tot} på ${d}, og gang med ${n}.`,why:`${tot} : ${d} = ${one}. ${one} · ${n} = ${n*one}.`})}});

unit({id:'t6-bdp',c:'t6',icon:'🔄',title:'Brøk, desimaltall og prosent',
 cards:[
  {h:'Samme tall, tre drakter',t:`<p>En halv kan kle seg ut på tre måter: ${frac(1,2)} = <b>0,5</b> = <b>50 %</b>. Det er akkurat samme mengde pizza!</p>`,v:V.pie(1,2)},
  {h:'Superviktige par',t:`<table style="font-size:19px;font-weight:800;border-collapse:collapse"><tr><td style="padding:4px 14px">1/2</td><td style="padding:4px 14px">0,5</td><td style="padding:4px 14px">50 %</td></tr><tr><td style="padding:4px 14px">1/4</td><td style="padding:4px 14px">0,25</td><td style="padding:4px 14px">25 %</td></tr><tr><td style="padding:4px 14px">3/4</td><td style="padding:4px 14px">0,75</td><td style="padding:4px 14px">75 %</td></tr><tr><td style="padding:4px 14px">1/10</td><td style="padding:4px 14px">0,1</td><td style="padding:4px 14px">10 %</td></tr><tr><td style="padding:4px 14px">1/5</td><td style="padding:4px 14px">0,2</td><td style="padding:4px 14px">20 %</td></tr></table>${tr('Desimaltall → prosent: gang med 100 (kommaet to hopp til høyre). 0,35 = 35 %.')}`}
 ],
 gen(l){const P=[[1,2],[1,4],[3,4],[1,10],[1,5],[2,5],[3,10],[7,10],[1,20],[3,5]];const [n,d]=pick(l===1?P.slice(0,5):P);const dec=n/d,pc=Math.round(dec*100);
  const T=[()=>N(`Skriv ${n}/${d} som desimaltall.`,dec,{hint:`Gjør nevneren til 10 eller 100.`,why:`${n}/${d} = ${pc}/100 = ${fmt(dec)}.`}),()=>N(`Hvor mange prosent er ${n}/${d}?`,pc,{why:`${n}/${d} = ${pc}/100 = ${pc} %.`}),()=>N(`Skriv ${fmt(dec)} som prosent.`,pc,{hint:'Gang med 100.',why:`${fmt(dec)} · 100 = ${pc} %.`}),()=>F(`Skriv ${pc} % som brøk, forkortet så mye som mulig.`,n,d,{exact:true,why:`${pc} % = ${pc}/100 = ${n}/${d}.`})];
  return pick(l===1?T.slice(0,2):l===2?T.slice(0,3):T)()}});

unit({id:'t6-vinkler',c:'t6',icon:'📐',title:'Vinkler',
 cards:[
  {h:'Rett vinkel = 90°',t:`<p>Hjørnet på en Minecraft-blokk eller et A4-ark er en <b>rett vinkel</b>: 90 grader. Vi tegner en liten firkant i hjørnet.</p>`,v:V.angle(90)},
  {h:'Spiss og stump',t:`<p><b>Spiss</b> vinkel: mindre enn 90° (spiss som en pizzabit).<br><b>Stump</b> vinkel: mellom 90° og 180° (åpen som en laptop som er slått langt bakover).<br><b>Rett linje</b>: 180°.</p>`,v:V.angle(130)},
  {h:'Turn og skruer',t:`<p>En hel skru i turn er <b>360°</b> – du snurrer helt rundt. En halv skru er 180°, og en kvart er 90°.</p>${tr('Vinklene i en trekant er alltid 180° til sammen.')}`}
 ],
 gen(l){if(l===1){const d=pick([rnd(20,80),90,rnd(100,170)]);const k=d<90?'Spiss':d===90?'Rett':'Stump';return C('Hva slags vinkel er dette?',k,['Spiss','Rett','Stump'],{vis:V.angle(d),why:`Vinkelen er ca. ${d}°. ${d<90?'Mindre enn 90° = spiss.':d===90?'Nøyaktig 90° = rett.':'Mellom 90° og 180° = stump.'}`})}
  if(l===2){const d=pick([30,45,60,90,120,150]);return C('Omtrent hvor mange grader er vinkelen?',d+'°',[30,45,60,90,120,150].filter(x=>x!==d).sort(()=>Math.random()-.5).slice(0,3).map(x=>x+'°'),{vis:V.angle(d),hint:'Sammenlign med en rett vinkel (90°).',why:`Vinkelen er ${d}°. ${d<90?'Den er mindre enn rett vinkel.':d===90?'Den er rett.':'Den er større enn rett vinkel.'}`})}
  return pick([()=>{const a=rnd(30,80),b=rnd(30,150-a);return N(`I en trekant er to vinkler ${a}° og ${b}°. Hvor stor er den tredje?`,180-a-b,{hint:'Alle tre blir 180° til sammen.',why:`180 − ${a} − ${b} = ${180-a-b}°.`})},()=>C('Hvor mange grader er en hel skru i turn?','360°',['180°','90°','100°'],{why:'Helt rundt = 360°.'}),()=>{const a=rnd(20,160);return N(`To vinkler ligger langs en rett linje. Den ene er ${a}°. Hvor stor er den andre?`,180-a,{why:`En rett linje er 180°. 180 − ${a} = ${180-a}°.`})}])()}});

unit({id:'t6-volum',c:'t6',icon:'📦',title:'Volum',
 cards:[
  {h:'Hvor mange blokker får plass?',t:`<p>Volum er hvor mye plass noe tar – hvor mange blokker du trenger for å fylle en boks.</p><p>Denne er 4 lang, 3 bred og 2 høy. Ett lag har 4 · 3 = 12 blokker. To lag: 12 · 2 = <b>24</b>.</p>`,v:V.box(4,3,2)},
  {h:'Formelen',t:`${tr('Volum = lengde · bredde · høyde')}<p>Måler vi i centimeter, blir svaret i <b>kubikkcentimeter (cm³)</b>. 1 liter = 1 dm³ = en terning som er 10 cm på hver kant.</p>`}
 ],
 gen(l){const a=rnd(2,l===1?4:5),b=rnd(1,l===1?3:4),c=rnd(1,l===1?2:4);
  if(l<3)return N('Hvor mange blokker er det i boksen?',a*b*c,{vis:V.box(a,b,c),hint:'Tell blokkene i det øverste laget, og gang med antall lag.',why:`${a} · ${b} = ${a*b} per lag. ${a*b} · ${c} lag = ${a*b*c}.`});
  const x=rnd(2,12),y=rnd(2,10),z=rnd(2,10);return N(`En eske er ${x} cm lang, ${y} cm bred og ${z} cm høy. Hva er volumet i cm³?`,x*y*z,{why:`${x} · ${y} · ${z} = ${x*y*z} cm³.`})}});

unit({id:'t6-malestokk',c:'t6',icon:'🧭',title:'Målestokk',
 cards:[
  {h:'Kart og modeller',t:`<p>En modellbil i <b>1 : 18</b> betyr at den ekte bilen er 18 ganger større. 1 cm på modellen = 18 cm i virkeligheten.</p>`},
  {h:'Kart: 1 : 100 000',t:`<p>På et kart i 1 : 100 000 er 1 cm = 100 000 cm = <b>1 km</b>. Måler du 4 cm på kartet, er det 4 km i virkeligheten.</p>${tr('Gang kartlengden med tallet etter kolon. Gjør om til meter eller km til slutt.')}`}
 ],
 gen(l){if(l===1){const s=pick([10,18,20,50]),c=rnd(2,12);return N(`En modell er laget i målestokk 1 : ${s}. Den er ${c} cm lang. Hvor lang er den i virkeligheten (cm)?`,c*s,{why:`${c} · ${s} = ${c*s} cm.`})}
  if(l===2){const c=rnd(2,9);return N(`Kartet har målestokk 1 : 100 000. Avstanden på kartet er ${c} cm. Hvor mange km er det?`,c,{hint:'1 cm = 100 000 cm = 1 km.',why:`${c} cm · 100 000 = ${c*100000} cm = ${c} km.`})}
  const s=pick([100,200,50]),m=rnd(2,10);return N(`En tegning av et hus har målestokk 1 : ${s}. En vegg er ${m} cm på tegningen. Hvor mange meter er veggen i virkeligheten?`,m*s/100,{hint:`Gang med ${s}, og gjør om cm til m (del på 100).`,why:`${m} cm · ${s} = ${m*s} cm = ${fmt(m*s/100)} m.`})}});

unit({id:'t6-stat',c:'t6',icon:'📈',title:'Median, typetall og variasjonsbredde',
 cards:[
  {h:'Typetall',t:`<p><b>Typetallet</b> er verdien som forekommer <b>oftest</b>. Skostørrelser i klassen: 38, 39, 39, 40, 39. Typetallet er 39.</p>`},
  {h:'Median: den i midten',t:`<p>Sorter tallene fra minst til størst. <b>Medianen</b> er tallet i midten.</p><p>3, 5, <b>7</b>, 8, 12 → medianen er 7.</p>${tr('Partall antall tall? Ta gjennomsnittet av de to i midten.')}`},
  {h:'Variasjonsbredde',t:`<p>Største minus minste. Tider på 60 meter: 8,2 og 10,5 sek → variasjonsbredde 2,3 sek. Den sier hvor spredt resultatene er.</p>`}
 ],
 gen(l){const n=pick(l===1?[5,7]:[5,6,7]);let v=Array.from({length:n},()=>rnd(1,20));
  const T=[()=>{const s=v.slice().sort((a,b)=>a-b);if(n%2===0)v.push(rnd(1,20));const s2=v.slice().sort((a,b)=>a-b);return N(`Finn <b>medianen</b>: ${v.join(', ')}`,s2[(s2.length-1)/2],{hint:'Sorter først.',why:`Sortert: ${s2.join(', ')}. Midterste tall er ${s2[(s2.length-1)/2]}.`})},
   ()=>{const t=pick(v);v=[...new Set(v)].filter(x=>x!==t);v.push(t,t,t);v=shuffle(v);return N(`Finn <b>typetallet</b>: ${v.join(', ')}`,t,{why:`${t} forekommer flest ganger.`})},
   ()=>N(`Finn <b>variasjonsbredden</b>: ${v.join(', ')}`,Math.max(...v)-Math.min(...v),{why:`Største ${Math.max(...v)} − minste ${Math.min(...v)} = ${Math.max(...v)-Math.min(...v)}.`}),
   ()=>{const w=Array.from({length:6},()=>rnd(1,20));const s=w.slice().sort((a,b)=>a-b);return N(`Finn <b>medianen</b>: ${w.join(', ')}`,(s[2]+s[3])/2,{hint:'Seks tall: ta gjennomsnittet av de to i midten.',why:`Sortert: ${s.join(', ')}. (${s[2]} + ${s[3]}) : 2 = ${fmt((s[2]+s[3])/2)}.`})}];
  return pick(l===1?T.slice(0,2):l===2?T.slice(0,3):T)()}});

unit({id:'t6-sanns',c:'t6',icon:'🎲',title:'Sannsynlighet',
 cards:[
  {h:'Gunstige delt på mulige',t:`<p>Hva er sjansen for å få 6 på en terning? Det er <b>6 mulige</b> utfall og <b>1 gunstig</b> (sekseren).</p><p>Sannsynligheten er ${frac(1,6)}.</p>${tr('Sannsynlighet = gunstige / mulige')}`},
  {h:'Fra umulig til sikker',t:`<p>0 = <b>umulig</b> (terningen viser 7). 1 = <b>sikker</b> (terningen viser et tall fra 1 til 6). ${frac(1,2)} = like stor sjanse begge veier, som mynt eller kron.</p>`,v:V.numline(0,1,{step:.25,label:.5,marks:[{v:0,l:'umulig',c:'var(--red)'},{v:.5,l:'50/50',c:'var(--sky)'},{v:1,l:'sikker',c:'var(--grass)'}]})}
 ],
 gen(l){if(l===1)return pick([()=>{const k=rnd(1,6);return F(`Hva er sannsynligheten for å få ${k} på en vanlig terning?`,1,6,{why:'1 gunstig av 6 mulige: 1/6.'})},()=>F('Hva er sannsynligheten for å få mynt når du kaster en mynt?',1,2,{why:'2 mulige (mynt, kron), 1 gunstig: 1/2.'}),()=>C('Hvor sannsynlig er det at terningen viser 7?','Umulig',['Sikker','Like sannsynlig','Sannsynlig'],{why:'Terningen har bare 1–6.'})])();
  const r=rnd(1,6),g=rnd(1,6),b=rnd(1,5),tot=r+g+b;
  if(l===2)return F(`I en pose er det ${r} røde, ${g} grønne og ${b} blå kuler. Du trekker én. Hva er sannsynligheten for <b>rød</b>?`,r,tot,{vis:`<div class="center" style="font-size:26px">${'🔴'.repeat(r)}${'🟢'.repeat(g)}${'🔵'.repeat(b)}</div>`,why:`${r} gunstige av ${tot} mulige: ${r}/${tot}.`});
  return pick([()=>F('Hva er sannsynligheten for å få et partall på en terning?',3,6,{why:'Partall: 2, 4, 6 → 3 av 6 = 1/2.'}),()=>F(`En kiste i Minecraft har ${tot} gjenstander: ${r} diamanter og ${tot-r} kull. Du tar én tilfeldig. Hva er sannsynligheten for <b>ikke</b> diamant?`,tot-r,tot,{why:`${tot-r} er ikke diamanter: ${tot-r}/${tot}.`}),()=>F('Hva er sannsynligheten for å få mer enn 4 på en terning?',2,6,{why:'5 og 6 → 2 av 6 = 1/3.'})])()}});

unit({id:'t6-rekkefolge',c:'t6',icon:'🧠',title:'Regnerekkefølge',
 cards:[
  {h:'Hvem går først?',t:`<p>Regnestykker har en køordning, akkurat som i kantina:</p><p><b>1. Parenteser</b> &nbsp; <b>2. Gange og dele</b> &nbsp; <b>3. Pluss og minus</b></p>`},
  {h:'Eksempel',t:`<p><b>2 + 3 · 4</b>: Gange først! 3 · 4 = 12, så 2 + 12 = <b>14</b>. (Ikke 20!)</p><p><b>(2 + 3) · 4</b>: Parentes først: 5 · 4 = <b>20</b>.</p>${tr('Strek over gange-/delestykkene med blyant, så ser du hva du skal regne først.')}`}
 ],
 gen(l){const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);if(l===1)return Math.random()<.5?N(`${a} + ${b} · ${c} = ?`,a+b*c,{fact:[b,c],hint:'Gange først.',why:`${b} · ${c} = ${b*c}. ${a} + ${b*c} = ${a+b*c}.`}):N(`${a*c} − ${b} · ${c} = ?`.replace(`${a*c} −`,`${a*c+b*c} −`),a*c,{why:`${b} · ${c} = ${b*c}. ${a*c+b*c} − ${b*c} = ${a*c}.`});
  if(l===2)return N(`(${a} + ${b}) · ${c} = ?`,(a+b)*c,{hint:'Parentesen først.',why:`${a} + ${b} = ${a+b}. ${a+b} · ${c} = ${(a+b)*c}.`});
  const d=rnd(2,5);return N(`${a} · ${b} + ${c*d} : ${d} = ?`,a*b+c,{hint:'Gange og dele først, så pluss.',why:`${a} · ${b} = ${a*b}, ${c*d} : ${d} = ${c}. ${a*b} + ${c} = ${a*b+c}.`})}});

/* ---------- ekstra temaer ---------- */
unit({id:'t2-penger',c:'t2',icon:'🪙',title:'Penger og handling',
 cards:[
  {h:'Mynter og sedler',t:`<p>Vi har mynter på <b>1, 5, 10 og 20 kr</b>, og sedler på <b>50, 100 og 200 kr</b>.</p><p>Tell alltid de største først. Da går det fortere – som å telle diamanter før kullbitene.</p>`,v:V.coins([20,10,5,1,1])},
  {h:'Penger tilbake',t:`<p>Du kjøper en burger til <b>32 kr</b> og betaler med en femtilapp. Tell oppover fra 32: til 40 er 8, til 50 er 10. Du får <b>18 kr</b> tilbake.</p>${tr('Veksel: tell opp fra prisen til det du betalte.')}`,v:V.numline(30,50,{step:1,label:10,jumps:[[32,40,'+8'],[40,50,'+10']]})}
 ],
 gen(l){if(l===1){const pool=[20,10,5,1];const list=Array.from({length:rnd(2,5)},()=>pick(pool)).sort((a,b)=>b-a);const s=list.reduce((a,b)=>a+b,0);return N('Hvor mange kroner er dette til sammen?',s,{vis:V.coins(list),hint:'Tell de største myntene først.',why:`${list.join(' + ')} = ${s} kr.`})}
  if(l===2){const pay=pick([20,50,100]),p=rnd(Math.floor(pay/3),pay-1);return N(`En is koster ${p} kr. Du betaler med ${pay} kr. Hvor mye får du tilbake?`,pay-p,{vis:V.coins([pay]),hint:`Tell opp fra ${p} til ${pay}.`,why:`${pay} − ${p} = ${pay-p} kr.`})}
  const n=rnd(2,5),p=rnd(5,25);return N(`Du kjøper ${n} ${pick(['boller','brus','tegneserier','klistremerkepakker'])} som koster ${p} kr hver. Hva må du betale?`,n*p,{hint:`${p} kr ${n} ganger.`,why:`${n} · ${p} = ${n*p} kr.`})}});

unit({id:'t3-symmetri',c:'t3',icon:'🦋',title:'Symmetri og speiling',
 cards:[
  {h:'Brett på midten',t:`<p>En figur er <b>symmetrisk</b> hvis du kan brette den på midten og begge halvdelene passer perfekt oppå hverandre. En sommerfugl er symmetrisk. Det er et Creeper-ansikt også!</p><p>Bretten kalles <b>symmetrilinje</b>.</p>`},
  {h:'Speiling i rutenett',t:`<p>Når du speiler et punkt, tell hvor langt det er fra linja. Det speilede punktet er like langt unna på <b>den andre siden</b>.</p><p>A står 2 ruter til venstre for linja, så A' står 2 ruter til høyre.</p>`,v:V.coord([{x:2,y:3,l:'A'},{x:6,y:3,l:"A'",c:'var(--sky)'}],8,4)},
  {h:'Hvor mange linjer?',t:`<p>Et kvadrat har <b>4</b> symmetrilinjer: loddrett, vannrett og to på skrå. Et rektangel har bare <b>2</b>.</p>${tr('Test med et speil eller ved å brette et ark!')}`,v:V.shape('kvadrat')}
 ],
 gen(l){if(l===1){const yes=pick(['A','H','M','O','T','U','V','W','X','Y']);const no=shuffle(['F','G','J','L','N','P','R','S','Z']).slice(0,3);return C('Hvilken bokstav er symmetrisk om en loddrett linje på midten?',yes,no,{hint:'Tenk deg at du bretter bokstaven på midten.',why:`${yes} ser lik ut på venstre og høyre side.`})}
  if(l===2){const[n,nm]=pick([[4,'et kvadrat'],[2,'et rektangel'],[3,'en likesidet trekant'],[6,'en regulær sekskant'],[5,'en regulær femkant']]);return N(`Hvor mange symmetrilinjer har ${nm}?`,n,{vis:V.shape(nm.includes('kvadrat')?'kvadrat':nm.includes('rekt')?'rektangel':n),why:`${nm[0].toUpperCase()+nm.slice(1)} har ${n} symmetrilinjer.`})}
  const m=rnd(3,5),x=rnd(0,m-1),y=rnd(1,7),mx=2*m-x;return {q:`Speil punktet A om den stiplede linja. Hva er koordinatene til A'?`,a:[mx,y],kind:'coord',show:`(${mx}, ${y})`,vis:V.coord([{x,y,l:'A'}],8,m),hint:`A står ${m-x} ruter fra linja.`,why:`A står ${m-x} til venstre for linja (x = ${m}). A' står ${m-x} til høyre: x = ${mx}. y er den samme: (${mx}, ${y}).`}}});

unit({id:'t4-algoritme',c:'t4',icon:'🤖',title:'Algoritmer og programmering',
 cards:[
  {h:'En oppskrift for datamaskiner',t:`<p>En <b>algoritme</b> er en oppskrift steg for steg. En pannekakeoppskrift er en algoritme. En redstone-krets i Minecraft også!</p><p>En datamaskin gjør <b>nøyaktig</b> det du sier – verken mer eller mindre.</p>`},
  {h:'Styr roboten',t:`<p>Roboten starter i (1, 1). Kommandoer: <b>→</b> ett steg høyre, <b>↑</b> ett steg opp, <b>←</b> venstre, <b>↓</b> ned.</p><p>→ → ↑ fra (1, 1) gir (3, 2).</p>`,v:V.coord([{x:1,y:1,l:'Start',c:'var(--muted)'},{x:3,y:2,l:'Mål'}],6)},
  {h:'Løkker: gjenta',t:`<p>I stedet for å skrive «+3, +3, +3, +3» skriver programmerere: <b>gjenta 4 ganger: +3</b>. Det kalles en <b>løkke</b>.</p>${tr('Løkke = gjenta. Gjenta 4 ganger +3 er det samme som + 4 · 3.')}`}
 ],
 gen(l){const ar={R:['→',1,0],L:['←',-1,0],U:['↑',0,1],D:['↓',0,-1]};
  if(l<3){let x=rnd(1,3),y=rnd(1,3);const sx=x,sy=y;const keys=l===1?['R','U']:['R','U','L','D'];const moves=[];for(let i=0;i<rnd(3,l===1?4:6);i++){const k=pick(keys);const[,dx,dy]=ar[k];if(x+dx<0||x+dx>8||y+dy<0||y+dy>8)continue;x+=dx;y+=dy;moves.push(ar[k][0])}
   return {q:`Roboten starter i (${sx}, ${sy}) og følger koden:<br><span style="font-size:30px;letter-spacing:4px">${moves.join(' ')}</span><br>Hvor havner den?`,a:[x,y],kind:'coord',show:`(${x}, ${y})`,vis:V.coord([{x:sx,y:sy,l:'Start',c:'var(--muted)'}]),hint:'Ta ett steg om gangen. → og ← endrer x, ↑ og ↓ endrer y.',why:`Fra (${sx}, ${sy}) gir ${moves.join(' ')} sluttpunktet (${x}, ${y}).`}}
  if(Math.random()<.5){const s=rnd(0,20),k=rnd(2,6),a=rnd(2,9);return N(`Programmet starter med tallet ${s}.<br><b>Gjenta ${k} ganger: legg til ${a}.</b><br>Hvilket tall har programmet til slutt?`,s+k*a,{hint:`Det er det samme som ${s} + ${k} · ${a}.`,why:`${k} · ${a} = ${k*a}. ${s} + ${k*a} = ${s+k*a}.`})}
  const k=rnd(2,3),a=rnd(1,2),b=rnd(1,2);return {q:`Roboten starter i (0, 0).<br><b>Gjenta ${k} ganger: gå ${a} høyre og ${b} opp.</b><br>Hvor havner den?`,a:[k*a,k*b],kind:'coord',show:`(${k*a}, ${k*b})`,hint:'Hver runde: x øker med '+a+' og y med '+b+'.',why:`x: ${k} · ${a} = ${k*a}. y: ${k} · ${b} = ${k*b}.`}}});

unit({id:'t5-deling',c:'t5',icon:'➗',title:'Dele større tall',
 cards:[
  {h:'Del opp tallet',t:`<p><b>84 : 4</b>: Del 84 i biter som er lette å dele: 80 og 4.</p><p>80 : 4 = 20 og 4 : 4 = 1. Til sammen <b>21</b>.</p><p>Tenk: 84 kjeks på 4 venner. Først 80 kjeks (20 hver), så 4 til (1 hver).</p>`},
  {h:'Velg smarte biter',t:`<p><b>156 : 6</b>: 120 kan deles på 6 (= 20). Da er det 36 igjen, og 36 : 6 = 6. Svar: 20 + 6 = <b>26</b>.</p>${tr('Finn en stor bit du kan dele lett (10-gangen!), så tar du resten etterpå. Sjekk med gange: 26 · 6 = 156 ✔')}`}
 ],
 gen(l){const b=rnd(2,l===1?5:9);const q=l===1?rnd(1,9)*10:l===2?rnd(11,29):rnd(21,Math.floor(999/b));const a=b*q;const big=Math.floor(q/10)*10*b,rest=a-big;
  return N(`${a} : ${b} = ?`,q,{fact:q<=10?[b,q]:null,hint:l===1?`Regn ${a/10} : ${b}, og heng på en null.`:`Del opp: ${big} : ${b} og ${rest} : ${b}.`,why:l===1?`${a/10} : ${b} = ${q/10}, så ${a} : ${b} = ${q}.`:`${big} : ${b} = ${big/b} og ${rest} : ${b} = ${rest/b}. ${big/b} + ${rest/b} = ${q}. Sjekk: ${q} · ${b} = ${a}.`})}});

unit({id:'t5-blandet',c:'t5',icon:'🥧',title:'Blandede tall og uekte brøk',
 cards:[
  {h:'Mer enn én hel',t:`<p>Du har 7 pizzabiter, og hver pizza har 4 biter. Det er ${frac(7,4)} pizza. En slik brøk, der telleren er større enn nevneren, kalles <b>uekte brøk</b>.</p>`,v:V.pie(4,4)+' '+V.pie(3,4)},
  {h:'Blandet tall',t:`<p>4 biter blir én hel pizza. 7 biter = 1 hel og 3 biter igjen. Vi skriver <b>1 ${frac(3,4)}</b>, et <b>blandet tall</b>.</p>${tr('Uekte → blandet: del teller på nevner. Svaret er de hele, resten er telleren.')}`},
  {h:'Tilbake igjen',t:`<p>2 ${frac(1,3)} som uekte brøk: 2 hele = ${frac(6,3)}, pluss ${frac(1,3)} = ${frac(7,3)}.</p><p>Regel: hele · nevner + teller.</p>`}
 ],
 gen(l){const d=pick([2,3,4,5,6,8]),w=rnd(1,l===3?4:2),n=rnd(1,d-1),T2=w*d+n;
  if(l===1)return N(`Hvor mange ${d===2?'halve':d===4?'fjerdedeler':d+'-deler'} er det i ${w} ${n}/${d}?`,T2,{vis:Array.from({length:w},()=>V.pie(d,d)).join(' ')+' '+V.pie(n,d),hint:`Hver hel har ${d} biter.`,why:`${w} · ${d} = ${w*d}, pluss ${n} = ${T2}.`});
  if(l===2)return {q:`Skriv ${T2}/${d} som blandet tall.`,a:[w,n,d],kind:'mixed',show:`${w} ${n}/${d}`,hint:`Hvor mange ganger går ${d} opp i ${T2}?`,why:`${T2} : ${d} = ${w} rest ${n}. Altså ${w} hele og ${n}/${d}.`};
  return F(`Skriv ${w} ${n}/${d} som uekte brøk.`,T2,d,{exact:true,hint:'Hele · nevner + teller.',why:`${w} · ${d} + ${n} = ${T2}. Svar: ${T2}/${d}.`})}});

unit({id:'t6-desgange',c:'t6',icon:'🧃',title:'Gange og dele desimaltall',

 ],
 gen(l){if(l===1){const k=rnd(1,9),n=rnd(2,9);return N(`0,${k} · ${n} = ?`,+(k*n/10).toFixed(1),{hint:`${k} tideler, ${n} ganger.`,why:`${k} · ${n} = ${k*n} tideler = ${fmt(k*n/10)}.`})}
  if(l===2){if(Math.random()<.5){const x=rnd(11,99)/10,n=rnd(2,6);return N(`${fmt(x)} · ${n} = ?`,+(x*n).toFixed(1),{hint:'Regn uten komma, og sett det inn igjen.',why:`${Math.round(x*10)} · ${n} = ${Math.round(x*10)*n}. Ett siffer etter kommaet: ${fmt(+(x*n).toFixed(1))}.`})}const n=rnd(2,6),q=rnd(11,49)/10;const x=+(q*n).toFixed(1);return N(`${fmt(x)} : ${n} = ?`,q,{hint:'Regn i tideler.',why:`${Math.round(x*10)} tideler : ${n} = ${Math.round(q*10)} tideler = ${fmt(q)}.`})}
  const p=rnd(5,40)+pick([0,.5,.9,.25,.75]),n=rnd(2,6);return N(`Du kjøper ${n} ${pick(['brus','pizzastykker','pakker tyggis','is'])} til ${p.toFixed(2).replace('.',',')} kr per stykk. Hva blir prisen?`,+(p*n).toFixed(2),{hint:'Regn uten komma, og sett inn kommaet med to siffer bak.',why:`${p.toFixed(2).replace('.',',')} · ${n} = ${(p*n).toFixed(2).replace('.',',')} kr.`})}});

unit({id:'t6-uttrykk',c:'t6',icon:'🔣',title:'Uttrykk og formler',
 cards:[
  {h:'Bokstaver er tall i forkledning',t:`<p>I algebra står en bokstav for et tall. <b>3x</b> betyr 3 · x. Er x = 4, så er 3x = 12.</p><p>Sett inn tallet, og regn ut: 3x + 2 = 3 · 4 + 2 = <b>14</b>.</p>`},
  {h:'Formler for mønstre',t:`<p>Du bygger rekker av firkanter med pinner. Figur 1 bruker 4 pinner, figur 2 bruker 7, figur 3 bruker 10. Hver ny figur trenger 3 pinner til.</p><p>Formelen er <b>3n + 1</b>, der n er figurnummeret. Figur 10: 3 · 10 + 1 = 31 pinner.</p>${tr('Formelen sparer deg for å tegne figur 100!')}`}
 ],
 gen(l){const x=rnd(2,10);if(l===1){const b=rnd(1,20);return Math.random()<.5?N(`x = ${x}. Hva er x + ${b}?`,x+b,{why:`${x} + ${b} = ${x+b}.`}):N(`x = ${x}. Hva er 2x?`,2*x,{why:`2x = 2 · ${x} = ${2*x}.`})}
  if(l===2){const a=rnd(2,9),b=rnd(1,15);return N(`x = ${x}. Hva er ${a}x + ${b}?`,a*x+b,{fact:[a,x],hint:'Gang først, så pluss.',why:`${a} · ${x} = ${a*x}. ${a*x} + ${b} = ${a*x+b}.`})}
  if(Math.random()<.5){const a=rnd(2,5),b=rnd(0,4),n=pick([10,12,20,25]);return N(`Figur n i et mønster har ${a}n${b?' + '+b:''} blokker. Hvor mange blokker har figur ${n}?`,a*n+b,{why:`${a} · ${n}${b?' + '+b:''} = ${a*n+b}.`})}
  const a=rnd(2,6),b=rnd(1,6);return N(`x = ${x}. Hva er ${a}(x + ${b})?`,a*(x+b),{hint:'Parentesen først.',why:`${x} + ${b} = ${x+b}. ${a} · ${x+b} = ${a*(x+b)}.`})}});

unit({id:'t6-trekant',c:'t6',icon:'⛺',title:'Areal av trekant og parallellogram',

  {h:'Trekant = halvt rektangel',t:`<p>En trekant er akkurat halvparten av et rektangel (eller parallellogram) med samme grunnlinje og høyde. Tenk på et telt eller et tak i Minecraft.</p><p>Areal = <b>g · h : 2</b>.</p>${tr('Bruk alltid høyden som står rett (90°) på grunnlinja, ikke den skrå siden.')}`,v:V.tri(6,4)}

let AC=null;function beep(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const notes=ok?[660,880]:[220,170];notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(ok?.15:.06,AC.currentTime+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.09+.16);o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.09);o.stop(AC.currentTime+i*.09+.18)})}catch(e){}}
/* confetti */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('#confetti');cv.hidden=false;const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#3FA34D','#F2B705','#3E9FDB','#E5484D','#8B5A2B','#6CCB5F'];
  const P=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,s:6+Math.random()*8,vx:-2+Math.random()*4,vy:2+Math.random()*4,c:pick(cols),r:Math.random()*6}));let f=0;
  (function loop(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore()});if(++f<170)requestAnimationFrame(loop);else{cv.hidden=true}})()}

/* ============ Kubo (Claude) ============ */
const RULES=`Du er Kubo, en blid og morsom matte-kompis (en liten kube-robot) i appen Mattekraft. Du hjelper en gutt på 11 år (6. trinn) som synes matte er vanskelig, særlig gangetabellen, desimaltall og brøk. Svar alltid på norsk bokmål.
Slik forklarer du:
- Kort og konkret, som en flink og tålmodig privatlærer. Ett steg om gangen, korte setninger.
- Bruk eksempler fra Minecraft, biler, turn, mat og gaming når det passer.
- Vis utregning steg for steg på egne linjer. Du kan tegne enkle figurer med tegn, f.eks. ■■■□.
- Gi et triks eller en huskeregel når det finnes.
- Spør han om svaret på en oppgave: gi først et hint og et hjelpespørsmål. Står han fortsatt fast, forklar hele veien til svaret.
- Ros innsatsen. Si aldri at noe er «lett» eller «enkelt».
- Avslutt gjerne med en liten kontrolloppgave han kan prøve.
- Maks ca. 150 ord. Ingen overskrifter. Bruk **fet** skrift sparsomt.
- Handler spørsmålet ikke om matte, svar vennlig og kort og led tilbake til matte.`;
const PHOTO_RULES=`Han har tatt et bilde av regnestykker (ofte håndskrevne lekser eller oppgaver fra boka). Gjør dette, og bruk gjerne opptil 300 ord her:
1. Les hvert regnestykke på bildet. Skriv oppgaven på én linje, så svaret hans, og sett ✅ hvis riktig eller ❌ hvis feil.
2. Ved ❌: si vennlig nøyaktig hvor det gikk galt (f.eks. glemt mente, komma på feil plass, la sammen nevnerne). Vis så riktig løsning steg for steg på egne linjer: «Steg 1: …», «Steg 2: …», og riktig svar til slutt.
3. Ved ✅: gi kort ros og gjerne et smart triks eller en snarvei.
4. Står det en oppgave uten svar: forklar metoden steg for steg med «Steg 1: …» osv. La ham gjerne prøve det siste steget selv, men skriv svaret nederst så han kan sjekke.

let L=null;
function makeQs(u,l,n=8){const qs=[],seen=new Set();let guard=0;while(qs.length<n&&guard++<80){const q=u.gen(l);const key=strip(q.q)+(q.vis||'').length;if(seen.has(key)&&guard<70)continue;seen.add(key);qs.push(q)}return qs}
function missionUnit(){const started=U.filter(u=>crowns(u.id)>0);const pool=started.length?started:U.filter(u=>['t3-gange1','t3-gange2','t4-brok','t4-desimal','t5-desimal'].includes(u.id));
  const weak=Object.entries(S.facts).filter(([k,f])=>f.w>=f.c).map(([k])=>k.split('x').map(Number));
  return {id:'mission',c:null,icon:'🎯',title:'Dagens oppdrag',gen(){if(weak.length&&Math.random()<.35){const[a,b]=pick(weak);return N(`<span class="note">🔥 Gangestykke du øver på</span><br>${a} · ${b} = ?`,a*b,{fact:[a,b],hint:tipFor(a,b),why:whyMult(a,b)})}
    const w=pool.map(u=>4-Math.min(3,crowns(u.id)));let r=Math.random()*w.reduce((a,b)=>a+b,0),u=pool[0];for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){u=pool[i];break}}
    const q=u.gen(Math.max(1,Math.min(3,crowns(u.id)||1)));q.q=`<span class="note">${u.icon} ${u.title}</span><br>`+q.q;return q}}}

function startLesson(u,l,n=8){L={u,l,queue:makeQs(u,l,n),i:0,total:n,firstOk:0,wrongIds:new Set(),fixed:0,combo:0,mistakes:0,xp:0,state:'ask',sel:null};renderQ()}
function renderQ(){const q=L.queue[L.i];const pct=Math.min(100,(L.firstOk+L.fixed)/L.total*100);
  const inputHtml=q.kind==='choice'?`<div class="opts">${q.opts.map(o=>`<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:`<input class="answer" id="ans" autocomplete="off" inputmode="${q.kind==='num'?'decimal':'text'}" aria-label="Svar"><div class="fmt-hint">${fmtHint[q.kind]}</div>`;
  $('#layer').innerHTML=`<div class="full" role="dialog" aria-label="Øving"><div class="full-head"><button class="x" id="quitL" aria-label="Avslutt">✕</button><div class="prog"><i style="width:${pct}%"></i></div><span class="combo">${L.combo>=3?'🔥'+L.combo:''}</span></div>
  <div class="full-body"><div class="wrap"><div class="note">${esc(L.u.title)}${L.u.id==='mission'?'':' · nivå '+L.l}${q.retry?' · <b>prøv igjen</b>':''}</div><div class="qtext">${q.q}</div>${q.vis?`<div class="vis-box">${q.vis}</div>`:''}<div id="inp">${inputHtml}</div>
   <div class="row" style="margin-top:12px">${q.hint?'<button class="btn ghost small" id="hintBtn">💡 Hint</button>':''}${tts?'<button class="btn ghost small" id="readQ">🔊</button>':''}</div><div id="hintTxt" class="trick" hidden>${q.hint||''}</div></div></div>
  <div class="foot" id="foot"><div class="wrap"><button class="btn block" id="checkBtn" disabled>Sjekk</button></div></div></div>`;
  const ans=$('#ans');const cb=$('#checkBtn');
  if(ans){ans.focus();ans.addEventListener('input',()=>cb.disabled=!ans.value.trim());ans.addEventListener('keydown',e=>{if(e.key==='Enter'&&ans.value.trim())submit()})}
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(L.state!=='ask')return;document.querySelectorAll('[data-opt]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');L.sel=b.dataset.opt;cb.disabled=false});
  cb.onclick=submit;$('#quitL').onclick=()=>{closeLayer();L=null};
  if($('#hintBtn'))$('#hintBtn').onclick=()=>{$('#hintTxt').hidden=false};
  if($('#readQ'))$('#readQ').onclick=()=>speak(q.q);
  L.state='ask';L.sel=null;}
function recordFact(q,ok){if(!q.fact)return;const[a,b]=q.fact;if(a<1||b<1||a>10||b>10)return;const k=Math.min(a,b)+'x'+Math.max(a,b);const f=S.facts[k]||{c:0,w:0};ok?f.c++:f.w++;S.facts[k]=f}
function submit(){if(L.state!=='ask')return;const q=L.queue[L.i];const given=q.kind==='choice'?L.sel:$('#ans').value;if(given==null||!String(given).trim())return;
  const ok=check(q,given);L.state='fb';recordFact(q,ok);beep(ok);let got=0;
  if(ok&&!q.retry){got=earn();L.kr=+((L.kr||0)+got).toFixed(2)}
  if(ok){L.combo++;S.stats.correct++;if(L.combo>S.stats.best)S.stats.best=L.combo;if(q.retry){L.fixed++;S.stats.fixed=Math.max(S.stats.fixed,L.fixed)}else{L.firstOk++;addGems(1);L.gems=(L.gems||0)+1}L.xp+=q.retry?1:2}
  else{L.combo=0;L.mistakes++;S.stats.wrong++;if(!q.retry)L.wrongIds.add(L.i);const again=L.u.gen(L.l);again.retry=true;/* re-ask same question later */const copy={...q,retry:true};L.queue.push(Math.random()<.5?copy:Object.assign(again,{retry:true}));}
  document.querySelectorAll('[data-opt]').forEach(b=>{if(b.dataset.opt===q.a)b.classList.add('right');else if(b.dataset.opt===given&&!ok)b.classList.add('wrong')});

  foot.innerHTML=`<div class="wrap"><div class="fb-title">${ok?pick(PRAISE):'Riktig svar: '+esc(showAns(q))}</div>${got?`<div class="note" style="font-weight:800">💰 +${krFmt(got)} · ${moneyToday().n}/${krCfg().goal} oppgaver i dag</div>`:''}${ok?(L.combo>=3&&L.combo%5===0?`<div class="why">🔥 ${L.combo} på rad! Du er i flytsonen!</div>`:''):`<div class="kubo-say">${KUBO(38,'sad')}<div style="min-width:0"><div class="why">${pick(COMFORT)}</div><div>${q.why||''}</div></div></div>`}
   ${!ok&&sample?'<button class="btn ghost small" id="explainBtn">🤖 Forklar meg dette, Kubo</button><div id="exOut" class="bubble" hidden></div>':''}
   ${ok&&q.why?`<details><summary class="note" style="cursor:pointer">Hvorfor?</summary><div>${q.why}</div></details>`:''}
   <button class="btn ${ok?'':'red'} block" id="contBtn">Fortsett</button></div>`;
  if($('#explainBtn'))$('#explainBtn').onclick=()=>{$('#exOut').hidden=false;$('#explainBtn').disabled=true;askKubo(`Oppgaven var: «${strip(q.q)}». Riktig svar er ${showAns(q)}. Han svarte «${given}». Forklar vennlig hvorfor svaret er ${showAns(q)}, og hva han kanskje tenkte feil. Bruk et eksempel han kjenner igjen.`,$('#exOut'))};
  const cont=$('#contBtn');cont.focus();cont.onclick=next;save();}

   ${L.fixed?`<p class="why">Du rettet opp ${L.fixed} feil underveis. Det er sånn man blir god!</p>`:''}

   <div class="kubo-say" style="justify-content:center">${KUBO(52)}<div class="bubble" style="flex:0 1 auto">${perfect?'Helt rått! Klar for neste nivå?':crownNew&&L.l<3?'Ny krone! Neste nivå er litt tøffere.':'Fortsett sånn, så blir du sterkere for hver runde!'}</div></div>
